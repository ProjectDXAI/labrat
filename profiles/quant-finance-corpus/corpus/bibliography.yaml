  tags:
  - base-rate
  - detection
  - false-alarm
  - transfer
  - regime
  notes: 'A detector with a 1% false-alarm rate is worthless when the event is one in ten thousand, because almost
    every alarm is false however good the ROC looks. This is the arithmetic that decides whether any rare-event
    signal is worth acting on, stated more bluntly here than anywhere in the trading literature.

    '
