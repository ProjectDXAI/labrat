  units:
  - unit_id: no-arbitrage-price
    topic: the fundamental value of a perpetual and the random-maturity argument behind it
    title: null
    locator: abstract and introduction, pp. 1-3
    kind: section
    pages: 4
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. A perpetual is not guaranteed to converge to spot, so the usual no-arbitrage price does
      not apply without extra restrictions; funding does the job that maturity does for a dated contract. The theoretical
      price is proportional to spot with a constant of proportionality rising in the ratio of the borrowing rate
      to the funding-rate intensity, so the basis is wider when cash is expensive relative to the funding paid for
      shorting. The derivation rests on random-maturity arbitrage, where time to convergence is itself random, because
      the position has to survive margin until it converges. Their own phrasing for the risk is that the arbitrageur
      must remain liquid longer than the market stays irrational.

      '
