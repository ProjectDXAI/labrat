- id: toth-2011-anomalous-price-impact
  title: Anomalous Price Impact and the Critical Nature of Liquidity in Financial Markets
  authors:
  - Bence Tóth
  - Yves Lempérière
  - Cyril Deremble
  - Joachim de Lataillade
  - Julien Kockelkoren
  - Jean-Philippe Bouchaud
  year: 2011
  bucket: market_microstructure
  form: paper
  venue: Physical Review X 1(2)
  identifiers:
    isbn: null
    doi: 10.48550/arXiv.1105.1694
    url: https://doi.org/10.48550/arXiv.1105.1694
  pages: 12
  density: high
  priority: 5
  rights:
    status: cc_by
    confidence: inferred
    evidence: null
    checked_at: null
    grant: null
    notes: null
  acquisition:
    state: owned
    copy_path: corpus/study/toth-2011-anomalous-price-impact.pdf
    source_url: https://arxiv.org/pdf/1105.1694
    obtained_at: '2026-08-06'
    note: Study copy from the repository copy the publisher serves free. Rights tag unchanged; this is a reading
      copy, not a corpus grant.
  units:
  - unit_id: latent-book-argument
    topic: the V-shaped latent order book and why it forces square-root impact
    title: null
    locator: abstract and sections 1-2, pp. 1-3
    kind: section
    pages: 4
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. The average latent supply and demand profile is V-shaped and vanishes at the current
      price, which follows from mild assumptions about order flow plus prices being approximately diffusive. Two
      consequences fall out of the same mechanism: metaorders have to be fragmented to be digested by the liquidity
      funnel, which is where long memory in order-flow sign comes from, and the anomalously small local liquidity
      breaks linear response, which is where the square-root law comes from.

      '
  - unit_id: impact-measures-distinguished
    topic: three quantities all called price impact, with different exponents
    title: null
    locator: section 2, pp. 2-3
    kind: section
    pages: 3
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly, and this is the operative bit for us. They distinguish (a) the immediate impact of an
      individual market order of size q, strongly concave with exponent about 0.2 or even logarithmic; (b) the average
      price change over an interval against total market order imbalance in that interval, which becomes more and
      more linear as the interval grows; and (c) the total impact of a metaorder of size Q, which follows the square-root
      law with exponent 0.4 to 0.7. They say explicitly that many authors unduly identify the first two. Reported
      exponents: Almgren about 0.6 on 700,000 Citigroup orders, Moro about 0.5 Madrid and 0.7 London, their own
      about 0.5 for small-tick and 0.6 for large-tick futures over Q/V from a few times ten to the minus four up
      to a few per cent.

      '
  refs:
  - target: bouchaud-2018-trades-quotes-prices
    relation: builds_on
  - target: kyle-2016-market-microstructure-invariance
    relation: cites
  - target: donier-2015-metaorder-impact-bitcoin
    relation: cites
  discovered:
    round: 0
    method: operator
    source: 'workstream expansion: batched priority queueing, probabilistic coherence, anytime-valid attribution'
  status: candidate
  tags:
  - impact
  - latent-liquidity
  - criticality
  - structural-import
  notes: 'The latent order book: displayed liquidity is a vanishing fraction of true supply, the density of latent
    orders vanishes linearly at the price, and the square-root impact law follows. The same "displayed is not executable"
    claim as the phantom-depth work, argued from the opposite direction.

    '
