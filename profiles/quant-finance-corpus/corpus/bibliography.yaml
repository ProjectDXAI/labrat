- id: chen-2008-complexity-combinatorial-market-makers
  title: Complexity of Combinatorial Market Makers
  authors:
  - Yiling Chen
  - Lance Fortnow
  - Nicolas Lambert
  - David M. Pennock
  - Jennifer Wortman
