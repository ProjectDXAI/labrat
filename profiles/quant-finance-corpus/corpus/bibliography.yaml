    doi: 10.48550/arXiv.0809.0822
    url: https://doi.org/10.48550/arXiv.0809.0822
  pages: 92
  density: high
  priority: 5
  rights:
    status: author_hosted_free
    confidence: inferred
    evidence: null
    checked_at: null
    grant: null
    notes: arXiv version widely available; licence unchecked.
  acquisition:
    state: owned
    copy_path: corpus/study/bouchaud-2009-how-markets-slowly-digest.pdf
    source_url: https://arxiv.org/abs/0809.0822
    obtained_at: '2026-08-06'
    note: Study copy from arXiv. The default arXiv grant licenses arXiv to distribute, not us to redistribute, so
      the rights tag is unchanged.
  units:
  - unit_id: s3
    topic: liquidity as the intermediary between information and price, and why prices are not in equilibrium
    title: null
    locator: section 3.7, pp. 19-20
    kind: section
    pages: 4
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. Liquidity is defined as the inverse of the price response to a trade of given size, and
      the response to information decomposes into the trade response to information divided by liquidity. The consequence
      they draw is that variation in the price response to news is as much a liquidity fact as an information fact,
      so reading a large move as a large signal conflates the two.

      '
  - unit_id: s4
    topic: long memory in order flow, and which sign series carries it
    title: null
    locator: section 4.1, pp. 24-25
    kind: section
    pages: 5
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. Order signs are reduced to plus or minus one because order sizes are heavy tailed with
      long memory of their own, so averages built on sizes converge slowly. Market orders, limit orders and cancellations
      each show long memory separately. The detail worth having: if a cancellation of a buy order is signed negative,
      matching the only direction of price move it can cause, the combined series of market orders, limit orders
      and cancellations does NOT show long memory. That is a directly checkable claim about our own feed, and it
      says which construction of order-flow sign is the informative one.

      '
  - unit_id: overview
    topic: the framework's claim about where processed information comes from
    title: null
    locator: abstract and section 1.1
    kind: section
    pages: 6
    priority: 4
    read_status: read
    concepts_expected: []
    notes: 'Read directly. Revealed liquidity is very low relative to latent supply and demand, so large orders
      are worked incrementally over periods as long as months, which is what makes order flow persistent. Their
      reading is that agents are at best weakly informed with similar and very noisy individual impact, and that
      most processed information comes from supply and demand itself rather than from external news.

      '
