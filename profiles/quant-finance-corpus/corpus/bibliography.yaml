  - online-learning
  - polymarket-relevant
  units:
  - unit_id: pricing-is-sharp-p-hard
    topic: the complexity of quoting an LMSR over a combinatorial outcome space
    title: null
    locator: sections 4-5, pp. 3-6
    kind: paper_section
    pages: 4
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. For subset betting the LMSR cost function is literally C(Q) = b log perm(B) with b_ij
      = exp(q_ij/b), so pricing reduces from the permanent of a 0-1 matrix and is #P-hard. Boolean betting restricted
      to disjunctions of two literals is #P-hard by reduction from #2-SAT, and conjunctions follow by negation.
      Chen et al. 2007 give a POLYNOMIAL-time algorithm for matching divisible subset bets, so the auctioneer and
      the market maker are in different complexity classes on the same bet language.'
  - unit_id: lmsr-is-weighted-majority
    topic: the correspondence between market-maker pricing and learning with expert advice
    title: null
    locator: section 6, pp. 7-8
    kind: paper_section
    pages: 2
    priority: 5
    read_status: read
    concepts_expected: []
    notes: Read directly. LMSR instantaneous prices have the exponential-weights form of Littlestone and Warmuth's
      Weighted Majority, with losses set to l_it = (2 eps - q_it)/(eta b). The market maker's b ln(n) worst-case
      subsidy is recovered from the Weighted Majority regret bound ln(n)/eta + eta T. Bounded market-maker loss
      and bounded learner regret are the same bound.
