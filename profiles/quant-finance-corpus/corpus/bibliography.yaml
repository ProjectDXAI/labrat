    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. The empirical starting point is that only nearly unstable Hawkes processes fit order-flow
      data properly, where nearly unstable means the L1 norm of the kernel is close to unity. Their main theorem:
      after suitable rescaling such processes converge to integrated Cox-Ingersoll-Ross. Applied to the Hawkes-based
      price model, the same criticality condition gives convergence to Heston. So criticality in the flow is not
      a curiosity of the estimate — it is the thing that generates the macroscopic volatility dynamics, and one
      model reproduces both the microstructure and the large-scale stylized facts.

      '
