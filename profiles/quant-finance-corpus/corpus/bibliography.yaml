# Seed bibliography for the quant-finance corpus.
#
# These are bibliographic RECORDS, not content. Nothing here contains a source's
# text: an entry says a work exists, what form it takes, what we may do with it,
# and which parts of it we want to read. `pages` counts pages that exist in the
# world, not pages we hold.
#
# Every rights tag is `confidence: inferred` or `unknown`, with no evidence URL.
# That is deliberate: the seed is a map of what exists, not a clearance decision.
# Nothing is manifest-eligible until a verify round attaches a licence page, a
# rights-holder statement, or a purchase/permission record.
#
# `units` decompose a source into reading targets — "the part of this book about
# dealer inventory". A unit carries no locator until someone opens the source and
# fills it in. Reading and compiling happen at unit granularity; a 656-page
# textbook is not a task.
#
# `refs` entries without an id are frontier targets: works the mapped literature
# points at that we have not catalogued yet.
# Page counts are estimates.

