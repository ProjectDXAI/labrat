  - survival
  - hazard
  - transfer
  - stopping
  notes: 'A position leaves by stop, by target, by timeout or by thesis decay, and these are competing risks rather
    than one event. `continuation_hazard` currently models the marginal hazard of a single cause, which is the exact
    error this paper exists to correct: the cumulative incidence of one cause is not recoverable from its cause-specific
    hazard alone.

    '
- id: gama-2014-survey-concept-drift-adaptation
  title: A Survey on Concept Drift Adaptation
  authors:
  - João Gama
  - Indrė Žliobaitė
  - Albert Bifet
  - Mykola Pechenizkiy
  - Abdelhamid Bouchachia
  year: 2014
  bucket: adjacent_disciplines
  form: survey
  venue: ACM Computing Surveys 46(4)
  identifiers:
    isbn: null
    doi: 10.1145/2523813
    url: https://doi.org/10.1145/2523813
  pages: 37
  density: high
  priority: 5
  rights:
    status: subscription_required
    confidence: inferred
    evidence: null
    checked_at: null
    grant: null
    notes: null
  acquisition:
    state: owned
    copy_path: corpus/study/gama-2014-survey-concept-drift-adaptation.pdf
    source_url: http://eprints.bournemouth.ac.uk/22491/1/ACM%20computing%20surveys.pdf
    obtained_at: '2026-08-06'
    note: Study copy from the repository copy the publisher serves free. Rights tag unchanged; this is a reading
      copy, not a corpus grant.
  units:
  - unit_id: real-vs-virtual-drift
    topic: the distinction between a changed conditional and a changed input distribution
    title: null
    locator: section 1, pp. 1-2
    kind: section
    pages: 4
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. Real concept drift is a change in the conditional distribution of the target given the
      inputs, and it can happen while the input distribution stays exactly the same. That separation is the operative
      one: monitoring the inputs for change will not see it, and every drift detector we run on price or flow features
      alone is watching the distribution that need not move. They also note the terminology is not settled and the
      same strategies have been reinvented under different names in different fields.

      '
  - unit_id: adaptation-and-evaluation
    topic: adaptation strategies and how adaptive algorithms are evaluated at all
    title: null
    locator: survey sections on adaptation and evaluation methodology
    kind: section
    pages: 14
    priority: 4
    read_status: read
    concepts_expected: []
    notes: 'Read the survey structure and its evaluation discussion. The hard part is that a held-out test set does
      not exist when the world changes underneath the model, so evaluation is prequential: predict, then observe,
      then update, scoring as you go. That is the same shape as the anytime-valid monitoring the corpus already
      carries, arrived at from a different direction.

      '
  refs:
  - target: montgomery-2019-statistical-quality-control
    relation: cites
  - target: basseville-1993-detection-abrupt-changes
    relation: cites
  - target: meeker-1998-statistical-methods-reliability
    relation: cites
  discovered:
    round: 8
    method: seed
    source: null
  status: candidate
  tags:
  - concept-drift
  - adaptation
  - streams
  - transfer
  - regime
  - agentic
  notes: 'The machine-learning name for a model whose world changed underneath it, with a taxonomy of drift types
    and the detectors and forgetting schemes that go with each. A trading model decaying toward its cost floor is
    concept drift, and this field has both the detection machinery and the honest accounting of how often detectors
    fire on nothing.

    '
