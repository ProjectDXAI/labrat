    topic: prediction gain against alarm fraction, and the loss function that should be optimised instead
    title: null
    locator: sections 5.3-5.5 and Table 2, pp. 13-15
    kind: section
    pages: 4
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. Prediction gain 21 at 1% alarm fraction for M>=6, degrading fast as the target fraction
      rises, because a significant share of events stay uncorrelated with past activity. Probability gain cannot
      be the optimisation target because it is maximised at zero alarm time. They use the Molchan-Kagan loss, the
      sum of alarm fraction and missed fraction, minimised around 10% alarm duration, with values 0.6-0.9 across
      parameters against 1.0 for a Poisson process with no skill. Also: the bare-propagator forecast is wrong in
      level but its relative evolution carries nearly the same information for restricted targets.

      '
