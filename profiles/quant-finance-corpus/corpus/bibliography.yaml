  notes: 'Leave the patch when its marginal rate of return falls to the average rate of the environment, travel
    time included. That is the exit rule with opportunity cost properly priced, and it is the answer PB-GIVEBACK
    keeps groping toward: the question is never "has this position given back too much", it is "is this position
    still beating what else I could be doing, net of the cost of switching".

    '
