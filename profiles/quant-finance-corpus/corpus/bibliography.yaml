  - unit_id: time-uniform-rates
    topic: what width a confidence interval must have to be valid at every time at once
    title: null
    locator: abstract and introduction
    kind: section
    pages: 8
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. Confidence sequences are uniformly valid over an unbounded horizon, with nonasymptotic
      coverage under nonparametric conditions and widths that go to zero. They connect three things: the Cramer-Chernoff
      method for exponential concentration, the law of the iterated logarithm, and the sequential probability ratio
      test — the sequences are time-uniform extensions of the first, tight nonasymptotic characterizations of the
      second, and nonparametric generalizations of the third. The operative fact is the rate: a time-uniform interval
      is wider than a fixed-sample one by a log-log factor, and that factor is the price of being allowed to look
      whenever you like. They derive an empirical-Bernstein bound growing at the LIL rate.

      '
