    topic: why reward models and propensity models each fail, and what doubly robust buys
    title: null
    locator: abstract and section 1
    kind: section
    pages: 5
    priority: 5
    read_status: read
    concepts_expected: []
    notes: 'Read directly. Evaluating a new policy on logged contexts, actions and rewards fails two ways: a model
      of rewards carries large bias, a model of the past policy carries large variance. The doubly robust estimator
      is accurate when EITHER model is good, and neither has to be consistent. That is the practical answer to the
      coverage problem, and it makes explicit what an offline estimate needs that a trace usually lacks: the propensity
      of each action under the policy that logged it.

