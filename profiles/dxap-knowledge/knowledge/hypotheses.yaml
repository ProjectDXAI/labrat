# Hypothesis cards.
#
# A concept is general. A hypothesis is what makes it testable in this system:
# a market context, an ex-ante prediction, a null, the operator that measures it,
# the eligible universe, the timestamp rule that keeps it point-in-time, the
# horizons at which the outcome matures, a cost model, and what would kill it.
#
# The cost model is required. An ex-ante prediction without costs is not a
# testable trading claim.

hypotheses:
  - hypothesis_id: HY-OFI-ENTRY
    concept_id: KC-MICRO-OFI
    market_context: "Perpetual futures on a liquid crypto venue, normal volatility regime, continuous trading."
    causal_story: >
      Net top-of-book queue change reflects pressure that has not yet been expressed in the price,
      so entries aligned with contemporaneous OFI should suffer less immediate adverse selection.
    ex_ante_prediction: >
      Entries taken with the sign of the trailing-50-update OFI have mean 30-second mark-out at
      least 0.5 basis points better than entries taken against it.
    null_hypothesis: "Mark-out is independent of the sign agreement between entry and trailing OFI."
    measurement_operator:
      method_id: order_flow_imbalance
      params: {window: 50}
      derived: "sign agreement between entry direction and OFI; mark-out at 30s"
    eligible_universe: "Instruments with continuous top-of-book data and at least 200 updates in the trailing window."
    decision_timestamp_rule: "OFI computed strictly from updates timestamped before the order is sent; no snapshot at or after the fill."
    outcome_horizons: [30s, 5m]
    cost_model: "Taker fee plus half-spread paid on entry; mark-out measured against arrival mid, not fill price."
    invalidation_conditions:
      - "No mark-out difference after controlling for spread and displayed depth."
      - "The effect exists only on the venue where the data is cleanest, and vanishes elsewhere."
      - "Effect size is smaller than the taker fee it would have to pay for."

  - hypothesis_id: HY-COST-FLOOR-ABSTAIN
    concept_id: KC-COST-FLOOR
    market_context: "Any venue, any instrument, decisions where the intended holding period is under one hour."
    causal_story: >
      Short-horizon gross edge shrinks faster than the round-trip cost floor, so a large share of
      short-hold entries are negative in expectation before they are placed.
    ex_ante_prediction: >
      Entries whose estimated gross edge is below the decision-time cost floor realize negative
      mean net return, and abstaining on them raises net return without materially lowering gross.
    null_hypothesis: "Net return is independent of whether estimated gross edge exceeded the decision-time cost floor."
    measurement_operator:
      description: "Decision-time floor = half-spread x 2 + fee tier + funding carry over intended hold + realized mark-out estimate."
      params: {}
    eligible_universe: "All entry decisions with an intended holding period and a live fee schedule."
    decision_timestamp_rule: "Spread, fee tier and funding rate as observed at the decision timestamp; no post-fill revision."
    outcome_horizons: [1h, 1d]
    cost_model: "Full round trip: both half-spreads, both fees, funding carry, and estimated adverse selection."
    invalidation_conditions:
      - "Abstaining on below-floor entries lowers net return, meaning the floor estimate is systematically too high."
      - "The floor is dominated by an adverse-selection estimate too noisy to act on."

  - hypothesis_id: HY-STOP-CONTINUATION
    concept_id: KC-STOP-CONTINUATION
    market_context: "Open winning positions past their first 20% giveback from MFE, any venue."
    causal_story: >
      Continuation value depends on the conditional probability of a further favourable excursion,
      which declines with giveback; exiting where that value falls below exit value should beat any
      fixed-fraction trailing rule.
    ex_ante_prediction: >
      Exits triggered by the continuation-value crossing capture at least 10% more of MFE than a
      fixed 30% giveback rule on the same episodes, net of exit cost.
    null_hypothesis: "MFE capture is the same under the continuation-value rule and the fixed-fraction rule."
    measurement_operator:
      method_id: continuation_hazard
      params: {bandwidth: 0.1, prior_strength: 4.0}
      derived: "continuation value vs. exit value including estimated exit cost"
    eligible_universe: "Episodes with at least 20 comparable matured predecessors in the same regime bucket."
    decision_timestamp_rule: "Episode history restricted to episodes matured strictly before the decision timestamp."
    outcome_horizons: [position_close, 1d]
    cost_model: "Exit half-spread and fee at decision-time depth; opportunity cost of capital until the horizon."
    invalidation_conditions:
      - "Support per bucket stays below 20 episodes, so the estimate is a base rate wearing a conditional's clothes."
      - "The advantage disappears once the persistence regime is controlled for — see KC-REGIME-PERSISTENCE."
      - "Capture improves but net return does not, meaning exit costs eat the difference."

  - hypothesis_id: HY-CUSUM-THESIS-DECAY
    concept_id: KC-DETECT-CUSUM
    market_context: "Positions entered on an identified catalyst, held into a possible regime change."
    causal_story: >
      When the process that justified entry has changed level, the entry thesis no longer holds,
      and a sequential detector should flag it earlier than a discretionary review would.
    ex_ante_prediction: >
      Positions where the detector alarms against the thesis direction have worse forward returns
      than those where it stays silent, measured from the alarm timestamp.
    null_hypothesis: "Forward return from the alarm timestamp is independent of whether the detector alarmed."
    measurement_operator:
      method_id: cusum_changepoint
      params: {drift: 0.5, threshold: 5.0, burn_in: 30}
      derived: "alarm timestamp and direction relative to position direction"
    eligible_universe: "Positions with at least 30 pre-entry observations for the reference estimate."
    decision_timestamp_rule: "Reference mean from the pre-entry window only; the statistic is causal by construction."
    outcome_horizons: [1h, 1d]
    cost_model: "Exit cost if the alarm is acted on; no cost if it is only recorded."
    invalidation_conditions:
      - "Alarm rate exceeds one per position on average — the parameters are detecting noise."
      - "Forward-return difference is not robust to the threshold within a factor of two."

  - hypothesis_id: HY-QUEUE-ADVERSE
    concept_id: KC-MICRO-QUEUE
    market_context: "Passive entries on price-time priority venues."
    causal_story: >
      Orders filled from deep in the queue fill precisely when the level is being consumed, so
      their mark-outs should be systematically worse.
    ex_ante_prediction: >
      Mean 30-second mark-out on passive fills degrades monotonically across queue-position
      quartiles at entry.
    null_hypothesis: "Mark-out is independent of initial queue position."
    measurement_operator:
      description: "Queue position at order placement; realized mark-out at 30s from arrival mid."
      params: {}
    eligible_universe: "Price-time priority venues where queue position is observable or estimable from depth."
    decision_timestamp_rule: "Queue position estimated from the book state at placement, not reconstructed after the fill."
    outcome_horizons: [30s, 5m]
    cost_model: "Maker rebate credited; adverse selection measured against arrival mid."
    invalidation_conditions:
      - "Monotonicity fails once instrument volatility is controlled for."
      - "The venue is pro-rata, in which case queue position is not the relevant state."

  - hypothesis_id: HY-STALE-PROBABILITY
    concept_id: KC-PRED-LIQUIDITY-MOVE
    market_context: "Prediction markets with thin books and intermittent flow."
    causal_story: >
      A price that has not traded since before a relevant news item is a stale quote rather than a
      belief, and should revert or re-rate once attention returns.
    ex_ante_prediction: >
      Markets whose last trade predates the most recent relevant catalyst show larger subsequent
      absolute price changes than markets that have traded since it, controlling for depth.
    null_hypothesis: "Subsequent absolute price change is independent of staleness relative to the catalyst."
    measurement_operator:
      description: "Time since last trade versus catalyst timestamp; depth-weighted price change over the following window."
      params: {}
    eligible_universe: "Markets with an observable catalyst timeline and depth snapshots."
    decision_timestamp_rule: "Catalyst and last-trade timestamps both strictly before the decision time."
    outcome_horizons: [1h, 1d, to_resolution]
    cost_model: "Both legs of the round trip at observed depth; capital held to resolution where applicable."
    invalidation_conditions:
      - "Staleness predicts change but not direction, so it is not tradable after costs."
      - "The catalyst timeline is not reliable enough to define staleness."

  - hypothesis_id: HY-XMKT-GAP
    concept_id: KC-XMKT-CONSISTENCY
    market_context: "The same event tradable on a prediction market and expressible on a perpetual venue."
    causal_story: >
      After fees, funding carry and resolution-basis adjustment, a persistent gap between implied
      probabilities is either an executable inconsistency or an unread rules difference.
    ex_ante_prediction: >
      Cost-adjusted gaps above the round-trip execution cost on both legs close by at least half
      before resolution.
    null_hypothesis: "Cost-adjusted gap size does not predict subsequent convergence."
    measurement_operator:
      description: "Cost-adjusted gap using both venues' fee schedules and the perp funding rate; convergence measured to resolution."
      params: {}
    eligible_universe: "Event pairs whose resolution criteria have been read and recorded as equivalent."
    decision_timestamp_rule: "Synchronized quotes within one second of the decision timestamp; funding rate as published at that time."
    outcome_horizons: [1d, to_resolution]
    cost_model: "Execution cost on both legs, funding carry to resolution, and margin capital cost."
    invalidation_conditions:
      - "Most gaps trace to resolution-criteria differences, which means the universe definition is wrong."
      - "The cheap leg is not executable at the observed price often enough to matter."

  - hypothesis_id: HY-AC-SCHEDULE
    concept_id: KC-EXEC-AC
    market_context: "Position exits large enough to move the book, worked over minutes."
    causal_story: >
      Scheduling the exit against a cost-variance trade-off should beat sending the whole order at
      once or working it uniformly when volatility and impact are jointly considered.
    ex_ante_prediction: >
      Realized shortfall under the scheduled exit is lower than under immediate execution by more
      than the added variance justifies, at the risk aversion implied by our sizing policy.
    null_hypothesis: "Realized shortfall is the same under scheduled and immediate execution."
    measurement_operator:
      method_id: almgren_chriss_schedule
      params: {intervals: 10}
      derived: "realized shortfall versus arrival price; realized variance across the schedule"
    eligible_universe: "Exits whose size exceeds one times displayed top-of-book depth."
    decision_timestamp_rule: "Impact and volatility parameters estimated from data strictly before the schedule starts."
    outcome_horizons: [execution_complete, 1h]
    cost_model: "Fees per child order, plus permanent and temporary impact against arrival mid."
    invalidation_conditions:
      - "Impact is concave in this instrument, so the linear schedule trades too fast."
      - "Information arriving mid-schedule dominates, meaning the stopping problem matters more than the schedule."

  - hypothesis_id: HY-BATCH-MAKER-PROTECTION
    concept_id: KC-BATCH-PRIORITY
    market_context: "Hyperliquid perpetuals, resting orders placed and cancelled within the same block, continuous trading."
    causal_story: >
      Cancels are applied before aggressive orders inside a batch, so a maker who cancels in the same
      batch as an incoming aggressive order escapes a fill that a continuous-time venue would have
      imposed. The adverse selection a resting order actually suffers should therefore be lower than
      the continuous-time queue calculation predicts, by an amount that scales with how often a cancel
      and an aggressive order land in the same batch.
    ex_ante_prediction: >
      Mean mark-out on passive fills is at least 20% less negative than the continuous-time queue-position
      prediction for the same orders, and the gap grows with the share of batches containing both a
      cancel and an aggressive order.
    null_hypothesis: "Realized passive mark-out matches the continuous-time queue-position prediction; batch category adds nothing."
    measurement_operator:
      method_id: batch_priority_fill
      params: {}
      derived: "displacement and escaped-cancel count per batch; realized mark-out at 1s and 10s conditional on category and intra-batch rank"
    eligible_universe: "Instruments with reconstructable batch boundaries and at least 500 passive fills in the window."
    decision_timestamp_rule: "Batch composition reconstructed only from actions timestamped before the batch closes; no use of the resulting fills to infer the ordering."
    outcome_horizons: [1s, 10s, 60s]
    cost_model: "Maker fee and funding carry over the resting interval; the comparison is mark-out against arrival mid, so no spread is credited."
    invalidation_conditions:
      - "Mark-out is fully explained by continuous-time queue position, meaning the batch is too fine relative to the horizon to matter."
      - "The advantage disappears once proposer identity is controlled for, meaning it was latency rather than the hierarchy."
      - "Batch boundaries cannot be reconstructed accurately enough for the category assignment to be stable."

  - hypothesis_id: HY-PHANTOM-DEPTH
    concept_id: KC-PHANTOM-DEPTH
    market_context: "Hyperliquid perpetuals, aggressive orders large enough to walk at least two levels."
    causal_story: >
      Resting orders are re-checked for margin at match time, so displayed size backed by deteriorating
      collateral fails exactly when volatility rises. Slippage estimated from the displayed book is
      therefore biased, and the bias is largest in the states where the estimate is being relied on.
    ex_ante_prediction: >
      Executable fraction at fully tested levels falls below 0.95 on average, and falls further in the
      top volatility quintile than in the bottom, by at least 3 percentage points.
    null_hypothesis: "Executable fraction is independent of volatility and statistically indistinguishable from one after accounting for ordinary cancellation."
    measurement_operator:
      method_id: depth_realization
      params: {side: buy}
      derived: "executable fraction and slippage per sweep, bucketed by trailing realized volatility"
    eligible_universe: "Sweeps that passed through at least one level, with a gap-free book snapshot immediately prior."
    decision_timestamp_rule: "The book snapshot must be the last one strictly before the order was sent; post-trade snapshots are excluded."
    outcome_horizons: [immediate]
    cost_model: "Slippage measured against the VWAP the displayed book predicted, taker fee excluded so the two legs are comparable."
    invalidation_conditions:
      - "The shortfall is the same in calm and volatile states, which points at ordinary cancellation rather than margin."
      - "The shortfall vanishes once sequence gaps are excluded, meaning it was a data artifact."
      - "The effect is smaller than the tick, so no execution decision could act on it."

  - hypothesis_id: HY-ENFORCED-VS-FREE
    concept_id: KC-EVENT-TREE-CONSTRAINTS
    market_context: "Polymarket, multi-outcome events, quotes sampled at a common instant."
    causal_story: >
      Where the token layer enforces a partition, an atomic split or merge collapses any breach at low
      cost, so breaches cannot persist. Where the relation holds only by convention, closing it requires
      several independent executions and a breach can survive. Persistence should therefore separate
      cleanly by enforcement class.
    ex_ante_prediction: >
      Cost-surviving partition breaches occur at least three times as often, and persist at least three
      times as long, on unenforced relations as on protocol-enforced ones.
    null_hypothesis: "Breach frequency and persistence are the same on enforced and unenforced relations."
    measurement_operator:
      method_id: event_tree_constraints
      params: {require_exhaustive: true}
      derived: "partitions by enforcement class, fed to prediction_market_consistency with settlement=atomic on the enforced class; breach duration until the sum returns within the hurdle"
    eligible_universe: "Events with at least two markets, all quoted within the same snapshot, excluding markets already resolved."
    decision_timestamp_rule: "Event grouping as recorded in the snapshot in force at the quote instant, not the grouping as it stands today."
    outcome_horizons: [1h, 1d]
    cost_model: "Legwise: round-trip cost per leg on unenforced relations. Atomic: one round trip plus the split or merge cost on enforced ones."
    invalidation_conditions:
      - "Breaches appear at similar rates on both classes, meaning the enforcement mechanism is not used in practice."
      - "Most apparent breaches trace to resolution-criteria differences, so the grouping was never a partition."
      - "Breaches concentrate in events too illiquid to trade in any size that pays for the transaction."

  - hypothesis_id: HY-RETRIEVAL-ANYTIME
    concept_id: KC-ANYTIME-ATTRIBUTION
    market_context: "Branch-isolated paper accounts on Hyperliquid, randomized at the branch-day level, retrieval on versus off."
    causal_story: >
      If compiled retrieval improves decisions, the per-branch-day net outcome under treatment exceeds
      the control mean. Because outcomes mature over days while the agent acts continuously, the
      comparison will be inspected long before any pre-planned sample size is reached, so it must be
      the kind of comparison that inspection does not invalidate.
    ex_ante_prediction: >
      The capital process against the null of no improvement reaches 20 within 60 matured branch-days,
      and the anytime lower confidence bound on the treatment-minus-control mean clears zero and stays there.
    null_hypothesis: "Mean net outcome per branch-day is no higher under retrieval than under control."
    measurement_operator:
      method_id: betting_eprocess
      params: {alpha: 0.05}
      derived: "per-branch-day paired net outcome, rescaled to [lo, hi] by the observed range, in maturation order"
    eligible_universe: "Branch-days whose positions have all matured or been marked to market at the horizon, arm assigned before the day opened."
    decision_timestamp_rule: "Arm assignment is deterministic from the branch-day seed and fixed before the first wake of that day; outcomes enter in maturation order only."
    outcome_horizons: [1d, 7d]
    cost_model: "Net of fees, funding and realized slippage; positions open at the horizon marked to market rather than dropped."
    invalidation_conditions:
      - "The sham arm moves the same way as the treatment arm, meaning the effect is deliberation rather than knowledge."
      - "The process crosses only when wakes rather than branch-days are treated as the unit, which is a clustering artifact."
      - "The interval is still wide after the planned rollout, meaning the design has too little power for the effect size that matters."

  - hypothesis_id: HY-COUNTERPARTY-PERSISTENCE
    concept_id: KC-COUNTERPARTY-INFO
    market_context: "Hyperliquid perpetuals, fills with both counterparty addresses, one month training against the following month."
    causal_story: >
      Informed participation is a persistent trait rather than a market state, so mark-out attributable
      to a counterparty in one period should predict mark-out attributable to the same counterparty in
      the next, over and above anything the contemporaneous book state says.
    ex_ante_prediction: >
      Spearman rank correlation between shrunk training mark-out and out-of-sample mark-out exceeds 0.3,
      and the top training tertile marks out at least 1 basis point worse for us than the bottom.
    null_hypothesis: "Counterparty identity carries no out-of-sample information about mark-out once market state is controlled for."
    measurement_operator:
      method_id: counterparty_markout
      params: {prior_strength: 10.0}
      derived: "shrunk per-address mark-out in the training month, rank-compared against the following month"
    eligible_universe: "Addresses with at least 20 aggressive fills in the training window and at least 5 in the test window."
    decision_timestamp_rule: "Training window closes strictly before the test window opens; no address is included on the basis of its test-window activity."
    outcome_horizons: [30s, 5m]
    cost_model: "Mark-out against arrival mid; the actionable version nets the maker rebate we would forgo by declining to quote against a flagged address."
    invalidation_conditions:
      - "Rank correlation is indistinguishable from zero, so identity adds nothing to the market state."
      - "The effect is entirely explained by speed, which a latency control removes."
      - "Address churn is fast enough that the training ranking covers too little of the test volume to act on."

  - hypothesis_id: HY-ALARM-LOSS
    concept_id: KC-ALARM-LOSS
    market_context: "Any regime or changepoint detector we run, evaluated on a held-out period disjoint from the one that chose its threshold."
    causal_story: >
      A threshold picked to maximise probability gain moves toward silence, because gain rises
      as the alarm set shrinks. A threshold picked to minimise alarm time plus missed events has
      an interior optimum, so it selects a rule that actually fires.
    ex_ante_prediction: >
      Thresholds chosen on the Molchan loss produce a lower out-of-sample loss than thresholds
      chosen on probability gain, by at least 0.1, and the gain-selected threshold alarms on
      under 2% of periods while missing over half the events.
    null_hypothesis: "The two selection criteria pick thresholds with indistinguishable out-of-sample loss."
    measurement_operator:
      method_id: molchan_error_diagram
      params: {cost_ratio: 1.0}
      derived: "loss and probability gain per threshold on train and on held-out test"
    eligible_universe: "Any detector producing a scalar score per period, with at least 30 target events in each period."
    decision_timestamp_rule: "Scores computed strictly from information before the period they alarm on; the threshold fixed on the training period before the test period opens."
    outcome_horizons: [1d, 7d]
    cost_model: "cost_ratio expresses the cost of time in alarm against the cost of a miss; the unweighted sum is reported alongside the trading-relevant weighting."
    invalidation_conditions:
      - "Both criteria select the same threshold, meaning the loss surface is flat and the choice does not matter."
      - "The loss-selected rule beats gain in sample and not out of sample, meaning the difference was threshold overfitting."
      - "Minimum loss is at or above 1.0, meaning the detector has no skill and the selection criterion is moot."

  - hypothesis_id: HY-CASCADE-SHORTFALL
    concept_id: KC-CASCADE-HORIZON
    market_context: "Hyperliquid perpetuals, trade-count forecasting over horizons of minutes to an hour."
    causal_story: >
      Activity over the horizon is dominated by events triggered by events that have not
      happened yet, so a forecast extrapolating only from observed events is short by roughly
      the total-descendants factor of the branching process.
    ex_ante_prediction: >
      Realised counts exceed the bare extrapolation by a factor that rises with the estimated
      branching ratio, and the renormalised forecast's mean absolute error is at least 20% lower
      than the bare forecast's at horizons of 15 minutes and beyond.
    null_hypothesis: "The bare and renormalised forecasts have indistinguishable error at every horizon."
    measurement_operator:
      method_id: cascade_forecast
      params: {decay: 0.5}
      derived: "bare against renormalised forecast error by horizon, bucketed by the branching ratio estimated on the observation window"
    eligible_universe: "Instruments with gap-free trade prints and enough windows to estimate a branching ratio."
    decision_timestamp_rule: "The branching ratio and the observed counts both come from windows ending at or before the forecast origin."
    outcome_horizons: [5m, 15m, 1h]
    cost_model: "None directly; this is a forecast-accuracy claim, and any trading use has to clear the cost floor separately."
    invalidation_conditions:
      - "The advantage disappears at horizons under a few minutes, which the source predicts and which would bound where this is worth using."
      - "The renormalised forecast wins only where the branching ratio is near one, where its multiplier is dominated by estimation error rather than by the mechanism."
      - "Relative direction of activity is all the downstream decision uses, in which case the correction changes no decision and is not worth its parameter."

  - hypothesis_id: HY-COHERENCE-OVERLAP
    concept_id: KC-JUDGMENT-AGGREGATION
    market_context: "Polymarket multi-outcome events with at least three legs and identifiable participants per leg."
    causal_story: >
      Incoherence across an event tree arises when the populations pricing each leg diverge, since
      each leg's price aggregates only the beliefs of whoever traded it. Where the same
      participants price every leg, the aggregation converges and the logical constraint holds.
    ex_ante_prediction: >
      Partition breach magnitude falls monotonically with participant overlap across legs, and
      events in the bottom overlap tertile show cost-surviving breaches at least twice as often
      as events in the top tertile.
    null_hypothesis: "Breach magnitude is independent of participant overlap across the legs."
    measurement_operator:
      description: "Jaccard overlap of the address sets trading each leg over the window, against the partition gap from event_tree_constraints fed to prediction_market_consistency."
      params: {settlement: atomic}
    eligible_universe: "Events whose legs are all quoted in the same snapshot, with at least 20 distinct addresses per leg."
    decision_timestamp_rule: "Overlap measured on the window ending at the quote instant; no use of trading that happens after the breach is observed."
    outcome_horizons: [1h, 1d]
    cost_model: "Atomic settlement cost on protocol-enforced partitions, legwise round-trip cost otherwise."
    invalidation_conditions:
      - "Overlap is uniformly high across events, so there is no variation to test against."
      - "Breach magnitude tracks depth or spread rather than overlap, which makes it a liquidity story and not an aggregation one."
      - "Address churn is fast enough that measured overlap is mostly noise."

  - hypothesis_id: HY-PERP-BASIS-RESIDUAL
    concept_id: KC-PERP-BASIS
    market_context: "Hyperliquid perpetuals against spot on the same underlying, across funding intervals."
    causal_story: >
      The fundamental basis is set by the borrowing rate against the funding-rate intensity, so
      the tradable quantity is the residual after that level rather than the raw basis. A
      strategy trading the raw basis is implicitly short the rates spread.
    ex_ante_prediction: >
      Regressing the observed basis on the rate-to-funding-intensity ratio leaves a residual whose
      mean reversion is at least twice as fast as the raw basis, and the residual predicts the
      next funding payment's sign better than the raw basis does.
    null_hypothesis: "The raw basis and the residual after the fundamental level have the same predictive content and the same reversion speed."
    measurement_operator:
      description: "Fundamental level from the borrowing rate over the funding-rate intensity; residual = observed basis minus that level; reversion by half-life of an AR(1) fit per instrument."
      params: {}
    eligible_universe: "Instruments with a continuously observable spot reference, a published funding rate, and a borrowing rate applicable to the account."
    decision_timestamp_rule: "Rates and funding as observed at or before the decision; no use of the funding payment being predicted."
    outcome_horizons: [8h, 1d, 7d]
    cost_model: "Both legs' taker fees plus funding carried over the holding period, and an explicit charge for the margin the random convergence time requires."
    invalidation_conditions:
      - "The residual reverts no faster than the raw basis, meaning the fundamental level adds nothing on this venue."
      - "Deviations comove so strongly across instruments that the residual is one factor, in which case this is a single bet and not a portfolio of them."
      - "The margin required to survive the random convergence time makes the strategy unprofitable at any size worth running."

  - hypothesis_id: HY-ORACLE-WEDGE
    concept_id: KC-ORACLE-LAG
    market_context: "Hyperliquid perpetuals, minutes around fast market moves."
    causal_story: >
      Time-weighted averaging makes the oracle lag the market by roughly half the averaging
      window. Because funding and liquidation read the oracle, the wedge between market and
      oracle price predicts when those mechanical flows fire, independently of what the market
      price alone would imply.
    ex_ante_prediction: >
      The market-to-oracle wedge leads liquidation clustering by a lag consistent with the
      averaging window, and liquidation volume in the top wedge decile is at least three times
      that in the bottom decile after controlling for realized volatility.
    null_hypothesis: "Liquidation timing is explained by the market price path alone, with no incremental information in the market-oracle wedge."
    measurement_operator:
      description: "Cross-correlation of the market-minus-oracle wedge against liquidation volume, bucketed by trailing realized volatility."
      params: {}
    eligible_universe: "Instruments where both oracle and mark are captured without sequence gaps over the window."
    decision_timestamp_rule: "Wedge measured from prices timestamped before the liquidation being predicted; no use of the liquidation itself."
    outcome_horizons: [1m, 5m]
    cost_model: "Taker fee plus expected slippage into the liquidation flow, which is the flow being predicted and therefore moves against a late entry."
    invalidation_conditions:
      - "The lead disappears once our own data-path latency is controlled for, meaning the wedge was measurement rather than mechanism."
      - "The oracle's window changes during the sample, making a single measured lag meaningless."
      - "Liquidation clustering is fully explained by realized volatility, leaving the wedge with no incremental content."
