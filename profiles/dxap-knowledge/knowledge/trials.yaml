  # they do not.
  # ------------------------------------------------------------------
  - trial_id: T-BATCH-PASSIVE
    applicable: true
    gold_concept_ids: [KC-BATCH-PRIORITY]
    counterevidence_concept_ids: [KC-MICRO-QUEUE]
    note: >
      Passive placement on a batching venue. Counterevidence must be the continuous-time queue
      argument, which is what the batch structure contradicts.
    context:
      context_id: ctx-batch-passive
      timestamp: "2026-08-04T11:15:00Z"
      market_type: perp_dex
      instrument: "HYPE-PERP"
      decision_type: entry
