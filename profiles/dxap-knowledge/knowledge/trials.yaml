      tools_available: [batch_priority_fill, order_flow_imbalance]
      latency_budget_seconds: 2.0
      uncertainties: ["whether a resting order here is protected by the intra-batch ordering or exposed the way a continuous venue would expose it"]
      state_notes: ["flat position", "intending to rest rather than cross", "one to two batches per block on this venue"]
      question: "Do I rest this order or cross the spread?"

