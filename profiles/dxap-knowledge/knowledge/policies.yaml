# Retrieval policies — the arms of the offline comparison.
#
# `raw_similarity` is the control: nearest-passage-style retrieval with no
# structural filters, no counterevidence requirement, and no abstention. It exists
# to be beaten, and to show what a plain RAG layer would have served.
#
# Candidates in this lab mutate these fields; the policy is the experiment.

policies:

  raw_similarity:
    filters: false
    k: 5
    expand_hops: 0
    require_counterevidence: false
    mmr_lambda: 1.0
    abstain_threshold: 0.0
    context_budget_cards: 5
    weights:
      relevance: 1.0
      evidence_availability: 0.0
      falsifiability: 0.0
      historical_utility: 0.0
      latency_penalty: 0.0
      context_penalty: 0.0

  filtered_only:
    filters: true
    k: 5
    expand_hops: 0
    require_counterevidence: false
    mmr_lambda: 1.0
    abstain_threshold: 0.05
    context_budget_cards: 5
    weights:
      relevance: 1.0
      evidence_availability: 0.0
      falsifiability: 0.0
      historical_utility: 0.0
      latency_penalty: 0.0
      context_penalty: 0.0

  decision_value:
    filters: true
    k: 3
    expand_hops: 1
    require_counterevidence: true
    mmr_lambda: 0.75
    abstain_threshold: 0.15
    context_budget_cards: 4
    weights:
      relevance: 1.0
      evidence_availability: 1.0
      falsifiability: 1.0
      historical_utility: 1.0
      latency_penalty: 0.15
      context_penalty: 0.1

  decision_value_wide:
    filters: true
    k: 5
    expand_hops: 1
    require_counterevidence: true
    mmr_lambda: 0.6
    abstain_threshold: 0.08
    context_budget_cards: 5
    weights:
      relevance: 1.0
      evidence_availability: 1.0
      falsifiability: 0.5
      historical_utility: 0.5
      latency_penalty: 0.1
      context_penalty: 0.15

  conservative_abstain:
    filters: true
    k: 2
    expand_hops: 1
    require_counterevidence: true
    mmr_lambda: 0.8
    abstain_threshold: 0.35
    context_budget_cards: 2
    weights:
      relevance: 1.0
      evidence_availability: 1.0
      falsifiability: 1.0
      historical_utility: 1.0
      latency_penalty: 0.2
      context_penalty: 0.2
