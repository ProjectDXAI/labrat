  - extension_id: EXT-BATCH-QUEUE
    title: "Queueing theory for a consensus batch with type-based priority"
    domain: queueing_networks
    workstream: hyperliquid_l4
    grounded_in:
      - "hyperliquid-api-docs#hypercore-order-book"
    what_the_source_leaves_open: >
      The venue documents price-time priority, and then documents that actions inside a consensus
      batch are sorted by a type hierarchy first — orders without GTC or IOC, then cancels, then
      orders carrying GTC or IOC — with proposer order breaking ties, at one or two batches per
      block. No model in the order-book literature describes that system. Cont's birth-death books,
      the queue-reactive model and every heavy-traffic result assume continuous time and genuine
      arrival-time priority.
    our_advantage: >
      We trade the venue and can observe the batch structure directly, and the ordering rule is
      documented rather than inferred, so the model has a specification rather than a guess at one.
    proposed_work: >
      Write the queueing model for a discrete batch with a deterministic type hierarchy: derive fill
      probability and expected adverse selection for a resting order as a function of its category,
      its position within the category, and the batch composition. Compare against the continuous
      price-time results the literature would predict.
    novel_claim: >
      Fill probability on this venue is not a function of queue position in the continuous sense.
      Because cancels are processed before aggressive orders within the same batch, a maker has a
      structural protection that a continuous-time venue cannot offer, and the standard adverse
      selection calculation overstates the cost of resting here.
    first_experiment: >
      Reconstruct batches from the feed, classify each action by category, and measure realized fill
      and mark-out conditional on category and intra-batch rank against the continuous-time
      prediction from queue position alone.
    first_computation: null
    would_be_novel_because: >
      The batched-matching literature argues about whether exchanges should batch. Nobody has written
      the queueing model for a venue that already does, with a published type hierarchy rather than
      a uniform auction.
    already_done_risk: 2
    kill_condition: >
      Fill and mark-out are explained by continuous-time queue position alone, meaning the batch
      structure is too fine relative to the trading horizon to matter.
    payoff: 5
    novelty: 5
    testability: 4
    maturity: 3
    effort: 4

  - extension_id: EXT-PHANTOM-DEPTH
    title: "Displayed depth that fails its margin check at match time"
    domain: market_microstructure
    workstream: hyperliquid_l4
    grounded_in:
      - "hyperliquid-api-docs#hypercore-order-book"
    what_the_source_leaves_open: >
      Margin is checked when an order opens and again for the resting side at the matching of each
      order. The consequence is stated nowhere: resting liquidity can be displayed and then fail at
      the moment it would execute, so displayed depth is an upper bound on executable depth by an
      amount nobody has measured.
    our_advantage: >
      On-chain state makes both sides observable — the resting order and the account backing it —
      which no centralized venue exposes.
    proposed_work: >
      Measure the rate and the size distribution of resting liquidity that fails at match, condition
      it on account leverage and on volatility, and build the correction from displayed to executable
      depth.
    novel_claim: >
      Phantom depth is a distinct adverse-selection channel from queue position and from spoofing,
      it concentrates exactly when volatility rises and margin binds, and it means slippage models
      built on displayed depth are biased in the state where the estimate matters most.
    first_experiment: >
      Compare intended against realized consumption for aggressive orders that walk the book, and
      test whether the shortfall rises with the leverage of the accounts resting at those levels.
    first_computation: null
    would_be_novel_because: >
      The microstructure literature treats displayed depth as executable, or discounts it for hidden
      liquidity and spoofing. A margin-driven failure channel is specific to a venue where positions
      and orders share a collateral account, and it has no analogue in the equity literature.
    already_done_risk: 2
    kill_condition: >
      The failure rate is negligible, or it is indistinguishable from ordinary cancellation.
    payoff: 4
    novelty: 5
    testability: 3
    maturity: 4
    effort: 4

  - extension_id: EXT-CTF-ATOMIC-ARB
    title: "Logical arbitrage priced against atomic settlement rather than leg risk"
    domain: optimal_transport
    workstream: polymarket
    grounded_in:
      - "polymarket-clob-docs#conditional-token-framework"
    what_the_source_leaves_open: >
      Splitting collateral mints a complete set of outcome tokens and merging a complete set returns
      collateral atomically. The cross-market arbitrage literature prices logical inconsistencies
      leg by leg, because in every market it studies the legs can come apart. Here, for the
      constraints the token layer enforces, they cannot.
    our_advantage: >
      We trade the venue where the settlement primitive exists, and the constraint set is explicit
      in the token structure rather than assumed.
    proposed_work: >
      Separate the logical constraints into those the token layer settles atomically and those that
      still require crossing each leg, price each class against its true hurdle, and measure how
      often each class is breached beyond that hurdle.
    novel_claim: >
      The tradability of a logical inconsistency on this venue is determined by whether the token
      layer enforces the constraint, not by the size of the inconsistency. A partition breach is a
      single transaction against collateral; a conjunction breach is a multi-leg execution with all
      the usual risk. Treating them with one cost model, as the literature does, systematically
      misranks the opportunities.
    first_experiment: >
      Run the consistency check across related markets under both cost models and compare the sets
      of violations each declares tradable against what could actually have been executed.
    first_computation: prediction_market_consistency
    would_be_novel_because: >
      Prediction-market arbitrage work predates the conditional-token settlement primitive and
      therefore has no reason to distinguish the two classes.
    already_done_risk: 3
    kill_condition: >
      Split and merge fees, or gas, exceed the gaps that appear in practice, collapsing the
      distinction between the two cost models.
    payoff: 4
    novelty: 4
    testability: 5
    maturity: 5
    effort: 2

  - extension_id: EXT-NEGRISK-BOUNDARY
    title: "Mapping which logical constraints the protocol enforces and which it leaves free"
    domain: economics_information
    workstream: polymarket
    grounded_in:
      - "polymarket-clob-docs#conditional-token-framework"
    what_the_source_leaves_open: >
      Negative-risk markets provide a conversion exchanging one NO token for YES tokens in the
      event's other outcomes, which mechanically enforces a partition relation. The documentation
      does not say which relations across the full market set are enforced this way and which are
      merely conventional.
    our_advantage: >
      The full market set and the token structure are both public, so the enforced constraint set can
      be enumerated rather than guessed.
    proposed_work: >
      Enumerate the logical relations implied by the market set, mark which are protocol-enforced,
      and test whether persistent mispricing lives exclusively in the unenforced complement.
    novel_claim: >
      Mispricing cannot persist where the protocol enforces the constraint, so the tradable surface
      is precisely the unenforced complement — and that complement is enumerable in advance rather
      than discovered by scanning prices.
    first_experiment: >
      Build the constraint graph for one large event tree, classify each edge as enforced or free,
      and compare the frequency and persistence of violations across the two classes.
    first_computation: prediction_market_consistency
    would_be_novel_because: >
      It inverts the usual scanning approach. Instead of searching prices for anomalies, it derives
      from the protocol where anomalies are even possible.
    already_done_risk: 3
    kill_condition: >
      Violations appear at similar rates on enforced and unenforced relations, which would mean the
      enforcement mechanism is not used in practice.
    payoff: 4
    novelty: 5
    testability: 4
    maturity: 4
    effort: 3

  - extension_id: EXT-AGENT-SHAM-ARM
    title: "A sham-retrieval arm for agentic decision traces"
    domain: inference_causality
    workstream: dxap_agents
    grounded_in:
      - "ramdas-2023-game-theoretic-statistics#open-problems"
    what_the_source_leaves_open: >
      The anytime-valid literature gives us monitoring that survives continuous peeking, and lists
      composite nulls and filtration choice as unresolved. It says nothing about the specific
      confound in an agentic system: that giving a model any additional context makes it deliberate
      longer, which changes behaviour independently of the content.
    our_advantage: >
      We control the retrieval layer and can serve matched-but-irrelevant cards, so the confound can
      be measured rather than argued about, and the ledger already records the offered-to-behaviour
      ladder needed to detect it.
    proposed_work: >
      Run a sham arm — cards matched for length, structure and citation density but irrelevant to the
      decision — alongside the real retrieval arm, and estimate how much of the behavioural change is
      attributable to content rather than to deliberation.
    novel_claim: >
      A meaningful fraction of measured behaviour change from retrieval in agentic systems is the
      deliberation effect rather than the knowledge, and without a sham arm every reported retrieval
      benefit in this setting is confounded.
    first_experiment: >
      Generate sham cards from real ones by substituting a different market type and horizon, run
      both arms over identical historical contexts, and compare tool-call rates and action changes.
    first_computation: null
    would_be_novel_because: >
      Retrieval evaluations for LLM agents report accuracy against labels. The placebo control is
      standard in clinical work and essentially absent here.
    already_done_risk: 2
    kill_condition: >
      The sham arm produces no behavioural change, meaning the deliberation confound is negligible
      and the simpler design was adequate.
    payoff: 5
    novelty: 4
    testability: 4
    maturity: 4
    effort: 3

