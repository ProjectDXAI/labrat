  # the extensions that exist because of what we actually capture.
  # ----------------------------------------------------------------------------

  - extension_id: EXT-COUNTERPARTY-FLOW
    title: "Per-counterparty informativeness, using the trade attribution the venue publishes"
    domain: market_microstructure
    workstream: hyperliquid_l4
    grounded_in:
      - "dxai-hyperliquid-ingest#clickhouse-schema"
    what_the_source_leaves_open: >
      Our trades table carries buyer and seller addresses on every fill. The entire empirical
      microstructure literature is built on anonymous data and spends enormous effort inferring
      what this column states outright — trade signing, participant classification, informed-trader
      identification. None of those inference methods are necessary here, and none of the results
      that depend on them have been checked against ground truth.
    our_advantage: >
      Counterparty identity on every fill, which no centralized venue exposes and which the
      published literature has never had. The inference methods it developed can be validated
      rather than merely used.
    proposed_work: >
      Build per-address flow profiles, measure the mark-out of each address's flow, and test whether
      adverse selection concentrates in a small set of counterparties. Separately, use the ground
      truth to measure the error rate of the standard trade-classification rules the literature
      relies on.
    novel_claim: >
      Adverse selection is not a property of the market state but of who is on the other side, and
      it is predictable from counterparty history. A second claim follows for free: the accuracy of
      classification-based microstructure results can be quantified rather than assumed.
    first_experiment: >
      Rank addresses by realized mark-out of their aggressive flow over a training period, then test
      whether the ranking predicts mark-out out of sample on the fills we take against them.
    first_computation: order_flow_imbalance
    would_be_novel_because: >
      Counterparty-attributed studies exist for a handful of regulator-access equity datasets and
      have never been run on a continuously trading crypto venue with public attribution.
    already_done_risk: 3
    kill_condition: >
      Address-level mark-out has no out-of-sample persistence, meaning counterparty identity carries
      no information beyond the market state already observed.
    payoff: 5
    novelty: 4
    testability: 5
    maturity: 4
    effort: 3

  - extension_id: EXT-EVENT-TREE-CONSTRAINTS
    title: "Deriving the logical constraint set from the captured event tree"
    domain: optimal_transport
    workstream: polymarket
    grounded_in:
      - "dxai-hyperliquid-ingest#polymarket-snapshots"
      - "polymarket-clob-docs#conditional-token-framework"
    what_the_source_leaves_open: >
      Our Polymarket snapshots already key every market to an event id, an event ticker, a series id
      and a series ticker, and carry mentioned symbols and a tracked coin. That is the logical
      grouping the joint-bounds work needs, and the link from a prediction market to a traded crypto
      instrument, both sitting unused in the schema.
    our_advantage: >
      The constraint set does not have to be reconstructed by parsing question text; it is already a
      key in the warehouse, alongside Hyperliquid data in the same database.
    proposed_work: >
      Generate partition and implication constraints automatically from the event and series
      grouping, run the consistency check continuously, and use the tracked-coin link to extend the
      same check across venues to the perpetual instrument.
    novel_claim: >
      A complete, continuously updated map of logical consistency across a prediction-market venue
      is derivable from metadata already captured, without any natural-language reasoning about what
      the questions mean — and the same key set extends the check to a second venue.
    first_experiment: >
      Group one week of snapshots by event id, treat each group as a partition, run the consistency
      check with atomic settlement, and measure how often the partition fails to sum to one beyond
      the cost hurdle.
    first_computation: prediction_market_consistency
    would_be_novel_because: >
      Published prediction-market arbitrage studies hand-select related markets. Deriving the
      relation set from the venue's own event structure makes the scan exhaustive rather than
      anecdotal.
    already_done_risk: 2
    kill_condition: >
      Event grouping does not correspond to a genuine partition often enough to be useful, because
      events contain markets that are neither exclusive nor exhaustive.
    payoff: 5
    novelty: 4
    testability: 5
    maturity: 5
    effort: 2

  - extension_id: EXT-ORDER-COUNT-QUEUE
    title: "Order count per level, not just size, as the queue state variable"
    domain: queueing_networks
    workstream: hyperliquid_l4
    grounded_in:
      - "dxai-hyperliquid-ingest#clickhouse-schema"
    what_the_source_leaves_open: >
      Our book table carries an order count alongside size at every level, and the best-bid-offer
      table carries counts on both sides. The queueing models of the order book — birth-death,
      queue-reactive, heavy-traffic — are written in terms of aggregate size at a level. A level
      holding one large order and a level holding twenty small ones are the same state to those
      models and are obviously different systems.
    our_advantage: >
      Order counts are captured already, at no additional cost, and were not available to the
      studies that built the models.
    proposed_work: >
      Add mean order size at each level as a state variable, and test whether cancellation intensity,
      fill probability and mark-out depend on it after conditioning on total size.
    novel_claim: >
      Level composition predicts level behaviour beyond level size: a level held by few large orders
      is more fragile than an equally deep level held by many small ones, because its survival
      depends on fewer independent decisions.
    first_experiment: >
      Regress level depletion time on total size and on order count separately, and test whether
      count carries incremental explanatory power.
    first_computation: null
    would_be_novel_because: >
      The models are size-based because most historical data was size-only. The refinement is
      obvious once the count exists, and the count usually does not.
    already_done_risk: 3
    kill_condition: >
      Order count adds nothing after conditioning on size, meaning composition does not matter.
    payoff: 3
    novelty: 4
    testability: 5
    maturity: 4
    effort: 2

  - extension_id: EXT-ORACLE-BASIS-CASCADE
    title: "The mechanical trigger of liquidation, observed directly"
    domain: defi_mechanics
    workstream: hyperliquid_l4
    grounded_in:
      - "dxai-hyperliquid-ingest#clickhouse-schema"
      - "hardiman-2013-critical-reflexivity#empirical-criticality"
    what_the_source_leaves_open: >
      Our market context table carries mid, mark and oracle prices together with funding and open
      interest. On this venue the oracle price drives liquidation, so the mechanical trigger of a
      cascade is directly observable rather than inferred. The cascade literature works with price
      and volume alone because that is all equity data provides.
    our_advantage: >
      The three prices, the funding rate and open interest arrive on the same event stream, so the
      state that determines whether a cascade can start is measurable before it does.
    proposed_work: >
      Build a fragility state from the mark-to-oracle basis, open interest and funding, and test it
      against the endogeneity measure as a competing and possibly complementary predictor of
      liquidation clusters.
    novel_claim: >
      Cascade risk on a perpetual venue decomposes into a mechanical component that is directly
      observable from the oracle basis and open interest, and a behavioural component that the
      endogeneity measure captures. Separating them should beat either alone, and nobody can attempt
      the decomposition on a venue that hides the trigger.
    first_experiment: >
      Regress liquidation clustering on basis and open-interest terms, then add the scale-resolved
      endogeneity measure and test for incremental explanatory power.
    first_computation: hawkes_branching_ratio
    would_be_novel_because: >
      Equity cascade studies must infer the constraint that forces selling. Here the constraint is
      published as a price feed.
    already_done_risk: 2
    kill_condition: >
      The mechanical state fully explains cascade clustering, leaving no room for the behavioural
      component — which would be a clean and useful negative result.
    payoff: 4
    novelty: 4
    testability: 4
    maturity: 4
    effort: 3

# Extensions we considered and are not proposing, with the reason. Kept so the same
# ideas do not resurface as if they were new.
declined:
  - name: reproduce_the_reflexivity_trend_debate
    reason: >
      Re-running the Filimonov-Sornette versus Hardiman disagreement on our data settles a question about an
      estimator, not about our markets. The disagreement is already resolved in the literature by a synthetic
      demonstration; repeating it buys nothing.
  - name: general_signature_deep_learning
    reason: >
      Feeding signatures into a neural network is the standard applied approach and is therefore neither novel
      nor diagnostic. The invariance property, isolated, is the part worth testing.
  - name: new_amm_curve_design
    reason: >
      Designing a better market-making curve is a protocol-design problem, not a trading problem, and we are not
      positioned to deploy one. Understanding losses on existing curves is.
