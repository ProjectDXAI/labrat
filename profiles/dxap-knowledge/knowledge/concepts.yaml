  - concept_id: KC-ALARM-LOSS
    canonical_name: "Probability gain is not an objective; the error diagram is"
    plain_description: >
      A rule that fires only in the most certain case has an enormous probability gain and
      predicts almost nothing. Optimising gain therefore selects silence. The quantity to minimise is the
      sum of the time spent in alarm and the share of events missed, and a value at or above
      one means no skill at all.
    mechanism: >
      Probability gain is the ratio of the event rate inside an alarm to the base rate. It is
      maximised as alarm time goes to zero because the tightest threshold selects only the
      most certain case. The Molchan error diagram plots the alarm fraction against the miss
      fraction across thresholds; their weighted sum is a loss with a real minimum, and a
      random rule sits at exactly one by construction, which gives an absolute rather than a
      relative reading of skill.
    formal_equations: "gain = P(event | alarm) / P(event); loss = c x tau + nu, where tau = share of periods in alarm and nu = share of events missed; no skill => loss = 1"
    assumptions:
      - "The alarm statistic uses only information available before the period it alarms on."
      - "The cost of time in alarm and the cost of a miss are expressible on a common scale."
      - "The threshold is chosen on a period disjoint from the one used to report the loss."
    market_types: [any]
    relevant_horizons: [minutes, hours, days]
    required_observables: [mid_price_series, matured_outcomes]
    required_data_resolution: "An alarm statistic and a realised event indicator over the same periods."
    expected_empirical_signature: >
      A loss curve with an interior minimum at a moderate alarm fraction rather than at the
      extremes, and a probability gain that is highest exactly where the loss is worst.
    alternative_explanations:
      - "A rule can minimise the loss by alarming almost always when events are common, which is a base-rate artifact rather than skill and shows up as a loss just under one."
    known_failure_modes:
      - "Both error rates are estimated on the sample that chose the threshold, so the minimising threshold is optimistically biased and needs a held-out period before it is quoted."
      - "The unweighted sum treats an hour of alarm and a missed event as equal, which is almost never the trade a trading decision faces. The weighting is a choice and must be stated with the result."
      - "The diagram is silent about magnitude: a rule that catches every event scores the same whether the events it catches are the large ones or the small ones."
      - "This is the diagnosis of our own over-cautious retrieval policy, which scores perfectly on clean trials and switches itself off under tool loss. A threshold tuned on gain rather than on loss produces exactly that behaviour."
    source_passage_ids:
      - "helmstetter-2003-predictability-etas#predictability-limits"
      - "jordan-2011-operational-earthquake-forecasting#probability-gain-and-decisions"
    contradicting_concept_ids: []
    alternative_note: "The competing practice is to report probability gain alone, which this card exists to refuse; it is a convention rather than an opposing theory."
    supporting_concept_ids: [KC-DETECT-CUSUM, KC-COST-FLOOR]
    implementation_status: implemented
