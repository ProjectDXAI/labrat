  - concept_id: KC-PRED-LIQUIDITY-MOVE
    canonical_name: "A probability move can be liquidity, not belief"
    plain_description: >
      In a thin prediction market, a price change often reflects one participant's size against a
      shallow book rather than any revision of collective belief.
    mechanism: >
      With few resting orders, a single order walks the book and resets the last price. Absent
      fresh flow, that price persists as a stale quote, and reads as a belief update to anyone
      sampling only the price.
    formal_equations: "Decompose the move into depth-consumed and post-move replenishment; a belief move should survive replenishment."
    assumptions:
      - "Depth and recent flow are observable, not just the last price."
      - "The market is not subject to a resolution-relevant catalyst inside the window."
    market_types: [prediction_market, clob_crypto, amm]
    relevant_horizons: [minutes, hours, days]
    required_observables: [market_probability, orderbook_depth, trade_prints]
    required_data_resolution: "Depth snapshots and trade prints around the move."
    expected_empirical_signature: >
      Price moves that revert once liquidity replenishes, with no accompanying change in related
      markets or in the underlying news flow.
    alternative_explanations:
      - "The single participant was informed, and the thin book merely made their information cheap to express."
    known_failure_modes:
      - "Assumes the observed book is the whole book; hidden or off-venue liquidity breaks it."
      - "In genuinely low-attention markets, staleness and correctness are indistinguishable for long periods."
    source_passage_ids:
