  # ----------------------------------------------------------------------------
  # Compiled from directly-read primary material (2026-08). Anchors below point at
  # sections actually read, not at recalled chapter numbers.
  # ----------------------------------------------------------------------------
  - concept_id: KC-HAWKES-CRITICALITY
    canonical_name: "Order flow sits near criticality, and the branching ratio measures how near"
    plain_description: >
      Most market events are triggered by other market events rather than by outside information.
      The share that is internally triggered is the branching ratio of a self-exciting process, and
      in the one market where it has been measured carefully over many years it sits at or just
      below one — the boundary beyond which activity would be explosive.
    mechanism: >
      Each event raises the intensity of future events through a decay kernel. If the kernel
      integrates to n, then on average each event begets n further events, and a shock is amplified
      by a factor 1/(1-n). At n near one the same external shock that is absorbed in a calm market
      propagates through many generations of triggered activity, which is what a cascade is.
    formal_equations: "lambda(t) = mu + integral phi(t-s) dN(s); n = integral phi; asymptotic Fano factor Var(N_T)/E[N_T] -> (1-n)^-2"
    assumptions:
      - "The kernel's mass lies inside the observation window, or the estimate is scale-local rather than global."
      - "Intraday seasonality has been removed; unmodelled activity cycles are read as self-excitation."
      - "The process is stationary within the estimation period."
    market_types: [clob_equities, clob_futures, clob_crypto, perp_dex]
    relevant_horizons: [seconds, minutes, hours]
    required_observables: [trade_prints]
    required_data_resolution: "Event timestamps at sub-second precision, aggregated into count windows."
    expected_empirical_signature: >
      Counts far more dispersed than Poisson, with dispersion that keeps growing as windows are
      aggregated — the signature of a power-law kernel with mass at long lags. Reported kernel
      exponents are near -1.15 below about a thousand seconds and near -1.45 above it.
    alternative_explanations:
      - "Unremoved intraday seasonality produces exactly the same overdispersion with no self-excitation at all."
      - "A common exogenous driver arriving in bursts mimics endogenous triggering."
    known_failure_modes:
      - "Fitting an exponential kernel on short windows returns a spuriously low and apparently rising branching ratio; this artifact produced a published claim that market reflexivity has been increasing."
      - "Because n is pinned near one across fourteen years of E-mini data, treating it as a freely varying regime indicator is probably wrong; what changed over that period was the correlation timescale, not the branching ratio."
      - "The estimate is blind to direction: an upward and a downward cascade are indistinguishable."
    source_passage_ids:
      - "hardiman-2013-critical-reflexivity#estimator-and-bias"
      - "hardiman-2013-critical-reflexivity#empirical-criticality"
      - "bacry-2015-hawkes-processes-finance#hawkes-market-impact"
    contradicting_concept_ids: [KC-REFLEXIVITY-DRIFT]
    supporting_concept_ids: [KC-MICRO-OFI]
    implementation_status: implemented
    confidence: 0.7
    problem_ids: [PB-REGIME-BREAK, PB-COST-DRAG, PB-INVENTORY-FUNDING]
    tags: [hawkes, criticality, endogeneity, cascade, read-directly]

  - concept_id: KC-REFLEXIVITY-DRIFT
    canonical_name: "Reflexivity varies over time and rises before instability"
    plain_description: >
      The competing account: the endogenous share of activity is not a constant of the market but a
      state that drifts, rising with automation and spiking before dislocations, which would make it
      a tradable early-warning signal.
    mechanism: >
      If the branching ratio genuinely moves, then periods of elevated self-excitation are periods
      in which the market is closer to its stability boundary, and the approach can be observed
      before the dislocation rather than only after it.
    formal_equations: "n_t estimated on rolling short windows with an exponential kernel; alarm when n_t approaches 1"
    assumptions:
      - "The estimator recovers the true branching ratio rather than a window-local one."
      - "The kernel is short-memoried enough that a thirty-minute window contains its mass."
    market_types: [clob_equities, clob_futures, clob_crypto]
    relevant_horizons: [minutes, hours, days]
    required_observables: [trade_prints]
    required_data_resolution: "Event timestamps within rolling windows of tens of minutes."
    expected_empirical_signature: "A rolling branching ratio that trends upward across years and spikes before known dislocations."
    alternative_explanations:
      - "The upward trend is an artifact of a shrinking high-frequency cutoff interacting with a fixed short window and a misspecified kernel."
    known_failure_modes:
