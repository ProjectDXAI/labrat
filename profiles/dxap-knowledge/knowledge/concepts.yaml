  - concept_id: KC-ANYTIME-ATTRIBUTION
    canonical_name: "Monitoring an agent's edge without a stopping rule fixed in advance"
    plain_description: >
      An agent acts far faster than its outcomes mature, and whoever is watching will look at the
      results continuously. A fixed-sample test read that way has no error guarantee left. A betting
      process keeps its guarantee under continuous peeking, at a cost in power, which makes it the
      right instrument for deciding whether retrieval — or any treatment — actually changed anything.
    mechanism: >
      Bet a fraction of a notional bankroll on each matured outcome against the null. Under the null
      the bankroll is a non-negative martingale with mean one, so by Ville's inequality the chance it
      ever reaches 1/alpha is at most alpha — at any stopping time, chosen however the observer likes.
      The reciprocal of the bankroll inverts into a confidence sequence that is valid at every time
      simultaneously, rather than at one sample size decided beforehand.
    formal_equations: "K_t = prod_{i<=t} (1 + lambda_i (X_i - m_0)), lambda_i predictable; P(exists t: K_t >= 1/alpha | H_0) <= alpha; CS_t = {m : K_t(m) < 1/alpha}"
    assumptions:
      - "Observations are bounded and arrive in the order they matured."
      - "The bet at each step uses only what was observable before that step."
      - "The unit of observation is independent under the null at the level it is analysed — which for an agent means the branch or day, not the wake."
    market_types: [any]
    relevant_horizons: [days, weeks]
    required_observables: [decision_log, matured_outcomes]
    required_data_resolution: "Matured, arm-labelled outcomes at the unit of randomization, in maturation order."
    expected_empirical_signature: >
      A capital process that stays near one while the treatment does nothing and grows steadily once
      it does, with a confidence sequence that narrows monotonically and needs no correction for
      having been looked at.
    alternative_explanations:
      - "Any measured behaviour change may be the generic effect of giving the model more context to deliberate over, not the content of that context — which is what a sham arm, and only a sham arm, separates."
      - "An agent's own account of which concept it used is a plausible narrative generated after the fact, and correlates with the decision without having caused it."
    known_failure_modes:
      - "The guarantee is about the null being true, not about the null being the right one. A well-specified test of the wrong quantity is still the wrong answer."
      - "Anytime-validity costs power. When the sample size genuinely is fixed in advance, this is the more conservative and worse tool."
      - "Observation order is load-bearing and unverifiable from the data: sorting the outcomes, or letting fast-maturing ones jump the queue, breaks the guarantee while the output looks identical."
      - "Clustering: thousands of wakes inside one account path are not thousands of observations, and analysing them as such makes the process cross for reasons that have nothing to do with the treatment."
    source_passage_ids:
      - "ramdas-2023-game-theoretic-statistics#e-values-and-ville"
      - "ramdas-2023-game-theoretic-statistics#open-problems"
    contradicting_concept_ids: []
    alternative_note: "The rival account is the deliberation confound rather than an opposing statistical claim; it is listed first among the alternative explanations because it is what the sham arm exists to measure."
    supporting_concept_ids: []
    implementation_status: implemented
    confidence: 0.7
    problem_ids: [PB-AGENT-ATTRIBUTION]
    tags: [attribution, anytime-valid, e-values, agentic, read-directly]
    workstream: dxap_agents

  - concept_id: KC-COUNTERPARTY-INFO
    canonical_name: "Adverse selection is a property of the counterparty, not only of the state"
    plain_description: >
      When fills carry the identity of both sides, adverse selection can be attributed to who was on
      the other side rather than inferred from market conditions. If a counterparty's flow marks out
      the same way next month as it did last month, then identity carries information the market
      state does not.
    mechanism: >
      Participants differ persistently in what they know and how fast they act. Flow from a
      persistently informed participant marks out against whoever fills it, and that persistence is
      what makes the history predictive. The empirical microstructure literature spends its effort
      inferring this attribution from anonymous prints; a venue that publishes both addresses on
      every fill removes the inference step and makes the classification rules themselves checkable.
    formal_equations: "shrunk_i = (sum markout_i + k * global) / (n_i + k); persistence = Spearman(rank of shrunk train markout, test markout)"
    assumptions:
      - "One address behaves as one participant over the measurement window."
      - "The training window closes strictly before the test window opens."
      - "Mark-out is signed consistently, against arrival mid rather than fill price."
    market_types: [perp_dex]
    relevant_horizons: [minutes, hours, days]
    required_observables: [trade_prints, counterparty_ids, mid_price_series]
    required_data_resolution: "Fills with both counterparty identifiers and a mid-price series fine enough to measure mark-out at the intended horizon."
    expected_empirical_signature: >
      Out-of-sample rank persistence in counterparty mark-out well above zero, with adverse selection
      concentrated in a small set of addresses rather than spread evenly across the population.
    alternative_explanations:
      - "The ranking reflects speed rather than information: fast participants mark out well because they are early, not because they know more."
      - "Persistence is an artifact of which counterparties trade in which conditions, so identity is proxying for the market state it was supposed to add to."
    known_failure_modes:
      - "Addresses split, rotate and pool, so persistence can be broken by identity churn rather than by absence of information."
      - "Counterparties present in both windows are the ones that kept trading, which is not a random subset of the population."
      - "Shrinkage strength is a choice rather than an estimate; a different prior changes the ranking of thin counterparties and therefore the measured persistence."
      - "Says nothing about causality, and the natural next step — avoiding those counterparties — changes their behaviour and ours."
    source_passage_ids:
      - "dxai-hyperliquid-ingest#clickhouse-schema"
    contradicting_concept_ids: [KC-MICRO-MECHANICAL-FLOW]
    supporting_concept_ids: [KC-MICRO-OFI]
