  - concept_id: KC-JUDGMENT-AGGREGATION
    canonical_name: "A market set can be collectively incoherent with every participant coherent"
    plain_description: >
      When logically connected questions are priced by overlapping but different groups of
      people, the collective prices can violate the logic even though no individual violates
      it. Incoherence across an event tree is therefore not proof that somebody is wrong, and
      the size of a breach is not a measure of how much anyone has mispriced.
    mechanism: >
      List and Pettit prove that no aggregation rule produces complete, consistent and
      deductively closed collective judgments while treating all propositions even-handedly,
      accepting any profile of individual views and weighting participants equally. The
      result holds even when every individual judgment set is itself complete, consistent and
      deductively closed. The driver is that each proposition attracts its own majority and
      those majorities diverge, so their intersection is a minority. A prediction market is
      an aggregation rule of exactly this kind, and each market in an event attracts its own
      population.
    formal_equations: "No F satisfying universal domain, anonymity and systematicity yields collective judgment sets that are complete, consistent and deductively closed (List and Pettit, Theorem 1)"
    assumptions:
      - "The markets in the set are genuinely logically connected, which the metadata asserts and the resolution criteria decide."
      - "Participants are identifiable across the legs well enough to measure overlap."
      - "Prices reflect the beliefs of whoever is actually trading each leg, not of a common marginal trader."
    market_types: [prediction_market]
    relevant_horizons: [hours, days, weeks]
    required_observables: [market_probability, event_tree, counterparty_ids]
    required_data_resolution: "Quotes for every leg of an event at a common instant, and participant identity per leg."
    expected_empirical_signature: >
      Partition and implication breaches that shrink as participant overlap across the legs
      rises, and persist where the populations pricing each leg are close to disjoint. The
      escape route the theorem names is convergence, so coherence should track overlap rather
      than tracking depth or spread.
    alternative_explanations:
      - "Breaches trace to resolution-criteria differences, so the legs were never logically connected and no aggregation result is needed to explain it."
      - "Breaches are execution artifacts: stale quotes, unsynchronised snapshots, or depth too thin to trade, all of which look like incoherence and are not."
      - "The population pricing each leg is the same but the breach survives because closing it is unprofitable after costs, which is a cost story rather than an aggregation story."
    known_failure_modes:
      - "The theorem is about aggregating judgments, and a market aggregates money-weighted bets rather than one-person-one-vote. Anonymity in the theorem's sense is exactly what a market does not satisfy, so this is a licence to expect incoherence rather than a derivation of its size."
      - "One address is not one participant, so measured overlap is a lower bound and its error is not random."
      - "It offers no direction: it says the breach need not imply anyone is wrong, not which leg is mispriced."
    source_passage_ids:
      - "list-2002-aggregating-sets-of-judgments#impossibility-theorem"
      - "list-2002-aggregating-sets-of-judgments#escape-routes"
    contradicting_concept_ids: [KC-EVENT-TREE-CONSTRAINTS]
