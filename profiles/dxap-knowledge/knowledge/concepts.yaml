  - concept_id: KC-CASCADE-HORIZON
    canonical_name: "Forecasting a self-exciting stream from what has been observed under-predicts it"
    plain_description: >
      Over any horizon longer than the immediate, most of the coming activity in a
      self-exciting stream will be triggered by activity that has not happened yet.
      Extrapolating from the events already on the tape therefore misses the larger part of
      what is coming, and the shortfall grows with how close the stream is to criticality.
    mechanism: >
      In a branching process each event has offspring, and those offspring have offspring.
      Summing the direct contribution of observed events counts only the first generation.
      The expected total descendants of one event is 1/(1-n) for branching ratio n, so a
      forecast that stops at the first generation is short by that factor. The correction is
      not a fudge: it integrates over the events that will occur inside the horizon and
      trigger further events before the horizon ends.
    formal_equations: "E[descendants of one event] = 1/(1-n); renormalised rate = bare rate x 1/(1-n) for subcritical n"
    assumptions:
      - "The branching ratio is stable over the forecast horizon."
      - "n is genuinely below one; above it the expectation does not exist and the question is malformed."
      - "The triggering kernel's mass is mostly inside the horizon being forecast."
    market_types: [clob_equities, clob_futures, clob_crypto, perp_dex]
    relevant_horizons: [minutes, hours]
    required_observables: [trade_prints, mid_price_series]
    required_data_resolution: "Event counts in consecutive equal windows, enough of them to estimate the branching ratio."
    expected_empirical_signature: >
      Realised activity over a horizon that exceeds a naive extrapolation of observed
      activity, by a factor that grows as the branching ratio rises, and a discrepancy that
      widens with the horizon rather than staying constant.
    alternative_explanations:
      - "Exogenous arrivals rose over the horizon for reasons unrelated to triggering, which produces the same shortfall with no cascade in it."
      - "The branching ratio was underestimated on the observation window, so the naive forecast was miscalibrated rather than structurally short."
    known_failure_modes:
      - "Near criticality the multiplier is dominated by estimation error in n, so a confident renormalised number there is an artifact of a point estimate rather than a forecast."
      - "The source's own result cuts against over-reading the level: the naive forecast is wrong in absolute terms but its relative evolution carries nearly the same information for restricted targets. When the decision only needs the direction of activity, the correction buys nothing and costs a parameter."
      - "A single decay parameter is a crude stand-in for a power-law kernel whose mass sits outside any one window, which is the same failure the branching-ratio estimator already carries."
    source_passage_ids:
      - "helmstetter-2003-predictability-etas#unobserved-cascade"
      - "athreya-1972-branching-processes#criticality-and-extinction"
    contradicting_concept_ids: []
    alternative_note: "Held to account by its own source: the paper shows both that the correction matters for the level and that it does not matter for many decisions."
    supporting_concept_ids: [KC-HAWKES-CRITICALITY]
    implementation_status: implemented
    confidence: 0.6
    problem_ids: [PB-REGIME-BREAK, PB-ABSORPTION]
