  - concept_id: KC-COST-FLOOR
    canonical_name: "The cost floor a signal must clear"
    plain_description: >
      A strategy's expected gross edge per trade must exceed the full round-trip cost — spread
      paid, fees, funding carry and expected adverse selection — before turnover is worth taking,
      and that floor rises with trade frequency.
    mechanism: >
      Each round trip pays half-spread twice in expectation, plus explicit fees, plus the mark-out
      loss from being selected against. Expected net edge is gross edge minus that floor. As
      holding period shrinks, gross edge typically shrinks faster than the floor does.
    formal_equations: "net = gross_edge - (spread_cost + fees + funding_carry + E[adverse_selection]); require net > 0 with margin for estimation error."
    assumptions:
      - "The fee schedule and funding rate applicable to this account are known, not assumed."
      - "Adverse selection is estimated from realized mark-outs rather than ignored."
    market_types: [any]
    relevant_horizons: [seconds, minutes, hours, days]
    required_observables: [fee_schedule, l1_book, position_state]
    required_data_resolution: "Current fee tier, funding rate and top-of-book spread at decision time."
    expected_empirical_signature: >
      Net-of-cost edge that turns negative below a characteristic holding period, visible as a
      cost-dominated regime in a holding-period sweep.
    alternative_explanations:
      - "Negative net results come from execution quality rather than from the signal being too weak."
    known_failure_modes:
      - "Maker rebates encourage passive strategies whose adverse selection exceeds the rebate."
      - "Funding carry on perpetuals is often omitted and can exceed the entire gross edge."
      - "Using average rather than decision-time spread understates the floor precisely on the trades that matter."
    source_passage_ids:
