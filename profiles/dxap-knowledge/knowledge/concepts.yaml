  - concept_id: KC-EARLY-WARNING-FRAGILITY
    canonical_name: "Critical slowing down is real and its false-positive rate is the binding constraint"
    plain_description: >
      Variance and autocorrelation rise as a system approaches a tipping point, which makes
      them generic leading indicators requiring no model of the mechanism. The problem is not
      whether the effect exists but whether a rise in an indicator is distinguishable from
      chance, and the answer depends on choices that look like preprocessing.
    mechanism: >
      Near a bifurcation the recovery rate from perturbation goes to zero, so the system's
      state carries further forward in time and its fluctuations grow. Both effects are
      measurable without knowing what the system is. But the indicators are computed on
      detrended, windowed data, and the detrending method and window length change the
      answer, so a trend in an indicator has to be tested against a null rather than read off.
    formal_equations: "lag-1 autocorrelation and variance of the detrended residual within a rolling window; trend tested against a surrogate or by a BDS test on the residuals"
    assumptions:
      - "The transition being approached is a bifurcation rather than a shock, since a shock arrives with no warning of this kind."
      - "The window is long enough to estimate the indicator and short enough that the system has not already changed."
      - "Detrending removed the trend and not the signal, which is a judgment and not a default."
    market_types: [any]
    relevant_horizons: [hours, days, weeks]
    required_observables: [mid_price_series]
    required_data_resolution: "A regularly sampled series long enough for a rolling window plus a null distribution."
    expected_empirical_signature: >
      A rising indicator trend that survives its own significance test, and residuals that a
      BDS test still finds structure in, since a rise on residuals with no remaining structure
      points at model misspecification rather than at an approaching transition.
    alternative_explanations:
      - "The rise is an artifact of the detrending model rather than of the system, which the source treats as the first thing to rule out."
      - "Non-stationary volatility produces rising variance with no change in recovery rate and therefore no approaching transition."
    known_failure_modes:
      - "The false-positive rate is the binding constraint, and the source is explicit about it: the methods proliferate faster than the tests that would tell you when they are wrong."
      - "Detrending choice and window length both move the indicator, so a result quoted without them is not reproducible."
      - "A shock is not a bifurcation. Most sharp market moves are the former and this says nothing about them."
    source_passage_ids:
      - "dakos-2012-methods-early-warnings#methods-and-false-positives"
    contradicting_concept_ids: [KC-REGIME-PERSISTENCE]
    supporting_concept_ids: [KC-DETECT-CUSUM, KC-FILTER-STATE]
    implementation_status: specified
    confidence: 0.45
    problem_ids: [PB-REGIME-BREAK, PB-THESIS-DECAY]
    tags: [critical-slowing-down, early-warning, false-positives, transfer, read-directly]

  - concept_id: KC-STRATEGY-CAPACITY
    canonical_name: "A strategy has a carrying capacity, and its return declines toward it"
    plain_description: >
      The return of a strategy falls as capital is deployed into it, because the trading that
      captures the edge is the same trading that moves the price against itself. There is a
      size at which total profit peaks, and past it more capital buys less profit rather than
      more.
    mechanism: >
      A strategy's profit is the edge per unit times the size deployed, minus the impact of
      deploying it. Impact grows with size, so profit is concave and has a maximum. Farmer
      calls that maximum the carrying capacity, borrowing from population ecology, where the
      same shape arises for the same reason: a population consuming a finite resource depresses
      the resource it lives on.
    formal_equations: "profit(size) = edge x size - impact(size) x size; capacity = argmax profit, where marginal edge equals marginal impact"
    assumptions:
      - "Impact rises with size over the relevant range, which is the empirical case rather than an axiom."
      - "The edge is not replenished by the trading that consumes it within the horizon."
      - "Other capital in the same strategy competes for the same edge, so capacity is shared and not per-account."
    market_types: [clob_equities, clob_futures, clob_crypto, perp_dex]
    relevant_horizons: [days, weeks]
    required_observables: [trade_prints, position_state, mid_price_series]
    required_data_resolution: "Realised returns against deployed size across a range wide enough to see curvature."
    expected_empirical_signature: >
      Return per unit falling with deployed size, and total profit peaking at an interior
      size, with the peak moving down as other participants run the same strategy.
    alternative_explanations:
      - "Returns fell because the edge decayed for unrelated reasons over the same period that size grew, which is confounded with capacity by construction and needs the size variation to be exogenous."
      - "Falling returns reflect worse execution at larger size rather than a genuine capacity limit, which is an implementation problem with a different fix."
    known_failure_modes:
      - "Capacity is shared across everyone running the strategy and is therefore not observable from our own returns alone."
      - "Estimating it requires size variation we mostly do not have, and the variation we do have was chosen in response to performance, which is the wrong direction of causality."
      - "The ecological framing is an analogy carrying real mathematics, not a derivation. It predicts the shape and not the level."
    source_passage_ids:
      - "farmer-2002-market-force-ecology-evolution#capacity-and-diversity"
      - "farmer-1999-frontiers-of-finance#evolutionary-efficiency"
    contradicting_concept_ids: []
    alternative_note: "Kept honest by its alternative explanations: edge decay and execution degradation both produce the same curve and are the first two things to rule out."
    supporting_concept_ids: [KC-IMPACT-SQRT, KC-COST-FLOOR]
    implementation_status: specified
    confidence: 0.5
    problem_ids: [PB-COST-DRAG, PB-IMPACT-TIMING]
    tags: [capacity, crowding, market-ecology, transfer, read-directly]

  - concept_id: KC-PERP-BASIS
    canonical_name: "A perpetual has a fundamental basis, and it is set by rates against funding intensity"
    plain_description: >
      A perpetual future is not obliged to converge to spot, so its price is not pinned by
      maturity. Funding does that job instead, and the level it pins the basis at is not zero:
      it rises with the cost of borrowing cash and falls with how aggressively funding
      responds to the gap. A non-zero basis is therefore the normal state, and only the
      deviation from that level is a signal.
    mechanism: >
      Holding spot against a short perpetual costs the cash borrowing rate and earns the
      funding stream. In equilibrium the perpetual price is proportional to spot, with a
      constant of proportionality increasing in the ratio of the interest rate to the
      funding-rate intensity. The argument is not riskless arbitrage: convergence happens at a
      random time, so the position must survive margin until it arrives. He, Manela, Ross and
      von Wachter call this random-maturity arbitrage and are explicit that the trade is risky
      in practice even where it looks riskless in theory.
    formal_equations: "perpetual price proportional to spot, with the constant rising in (interest rate)/(funding-rate intensity); convergence at a random stopping time rather than a fixed maturity"
    assumptions:
      - "The funding mechanism actually responds to the gap it is meant to close, at the intensity assumed."
      - "The cash borrowing rate applicable to us is known, not proxied by a reference rate."
      - "The position can be carried until convergence without being liquidated, which is the whole content of the random-maturity caveat."
    market_types: [perp_dex, clob_crypto]
    relevant_horizons: [hours, days, weeks]
    required_observables: [mark_price, oracle_price, funding_rate, mid_price_series, position_state]
    required_data_resolution: "Mark, oracle and funding series at the funding interval or finer, with the borrowing rate that applies to the account."
    expected_empirical_signature: >
      A basis that is systematically non-zero and tracks the rate-to-funding-intensity ratio,
      with deviations from that level that comove across instruments rather than being
      instrument-specific, and that have narrowed over time as the market matured.
    alternative_explanations:
      - "The basis reflects the cost and scarcity of leverage on the venue rather than a rates relationship, which produces a similar level and a different comparative static."
      - "Deviations comove because a common liquidity factor moves every instrument at once, not because a common mispricing is being corrected."
    known_failure_modes:
      - "Treating any non-zero basis as an opportunity. The fundamental level is non-zero, so the tradable quantity is the residual after it, and a strategy that ignores this is short the rates spread without knowing it."
      - "The convergence time is random, so a position sized as if it were a riskless arbitrage will be liquidated at the worst moment. The authors say so directly."
      - "Deviations diminishing over time means an estimate fitted on old data overstates what is available now."
      - "Says nothing about which side the deviation will close from, and a basis can close by spot moving as easily as by the perpetual moving."
    source_passage_ids:
      - "he-2022-fundamentals-perpetual-futures#no-arbitrage-price"
      - "he-2022-fundamentals-perpetual-futures#empirical-deviations"
    contradicting_concept_ids: []
    alternative_note: "Held to account by its alternative explanations: a leverage-scarcity account produces the same level with different comparative statics, and is the first thing to separate it from."
    supporting_concept_ids: [KC-XMKT-CONSISTENCY, KC-COST-FLOOR]
    implementation_status: specified
    confidence: 0.6
    problem_ids: [PB-XMARKET, PB-INVENTORY-FUNDING, PB-COST-DRAG]
    tags: [perpetuals, funding, basis, random-maturity, read-directly]
    workstream: hyperliquid_l4

  - concept_id: KC-ORACLE-LAG
    canonical_name: "An oracle buys manipulation resistance with staleness, and both are mechanical"
    plain_description: >
      The standard defence against manipulating an on-chain price is to average it over time,
      which by construction makes the reported price lag the market. On a venue where the
      oracle drives funding and liquidation, that lag is not a data-quality nuisance: it is a
      predictable, mechanical wedge between what the market is doing and what the protocol
      believes, and it moves money.
    mechanism: >
      Manipulating a spot price for one block is cheap with borrowed capital, so aggregators
      average over several blocks, which raises the cost of manipulation in proportion to the
      window and delays the reported price by the same window. Separately, a feeder that has
      stopped updating still passes validity checks, so stale data enters the aggregate as
      though it were fresh unless the aggregator ranks feeders on timeliness. Both effects push
      the protocol's price behind the market, and both are largest exactly when the market is
      moving fastest.
    formal_equations: "reported price = time-weighted average of the underlying over the window; manipulation cost rises with window length while reported price lags by roughly half of it"
    assumptions:
      - "The oracle's averaging window and update cadence are known rather than inferred from the output."
      - "The venue's funding and liquidation logic reads the oracle rather than the venue's own mark."
      - "A stale feeder is distinguishable from a quiet market, which needs the update timestamp and not just the value."
    market_types: [perp_dex, amm]
    relevant_horizons: [seconds, minutes, hours]
    required_observables: [oracle_price, mark_price, mid_price_series, funding_rate]
    required_data_resolution: "Oracle and market price series at finer granularity than the oracle's own update interval."
    expected_empirical_signature: >
      A lead-lag between market price and oracle price with a sign and magnitude set by the
      averaging window rather than by information, widening in fast markets, and funding and
      liquidation events clustering where the wedge is largest rather than where the market
      price alone would put them.
    alternative_explanations:
