  - concept_id: KC-XMKT-CONSISTENCY
    canonical_name: "Cross-market probability consistency after costs"
    plain_description: >
      Related contracts across venues imply probabilities that must be consistent once fees,
      funding, resolution rules and settlement timing are accounted for; an apparent inconsistency
      is usually a rules difference rather than an edge.
    mechanism: >
      Two contracts on the same event are only comparable when their resolution criteria, sources
      and timing agree. After adjusting for fees, funding carry to resolution, and the probability
      mass assigned to ambiguous resolutions, the remaining gap is the tradable inconsistency.
    formal_equations: "gap = p_A - p_B - fees - funding_carry - resolution_basis; trade only when gap exceeds execution cost on both legs."
    assumptions:
      - "Both venues' resolution rules have been read, not assumed equivalent."
      - "Both legs can actually be executed at the observed prices."
      - "Capital and margin constraints allow holding both legs to resolution."
    market_types: [prediction_market, clob_crypto, perp_dex]
    relevant_horizons: [hours, days, weeks]
    required_observables: [cross_market_quotes, market_probability, fee_schedule, funding_rate]
    required_data_resolution: "Synchronized quotes across venues plus the current fee and funding schedules."
    expected_empirical_signature: >
      A gap that persists after cost adjustment and closes toward resolution, rather than one that
      appears and disappears with quote staleness on one leg.
    alternative_explanations:
      - "The gap is a resolution-criteria difference, correctly priced by both venues."
      - "One leg's quote is stale and the gap is not executable."
    known_failure_modes:
      - "Ignoring funding carry on a perp leg turns a positive-carry arbitrage into a loss."
      - "Assuming both legs fill: the cheap leg is often the one that disappears."
      - "Resolution-source differences are the most common cause of a gap that never closes."
    source_passage_ids:
