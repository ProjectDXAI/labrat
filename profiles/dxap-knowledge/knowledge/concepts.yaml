    tags: [irreversibility, entropy-production, screening, read-directly]

  - concept_id: KC-SIGNATURE-PATH
    canonical_name: "Path signatures: features that do not depend on the clock"
    plain_description: >
      The iterated integrals of a path summarize what the path did in a way that is unchanged if the
      path is traversed faster, slower or unevenly. For market data, where the sampling clock is a
      modelling choice rather than a fact, that invariance removes a hidden degree of freedom.
    mechanism: >
      The signature is the collection of iterated integrals of a path, and it is invariant under
      reparametrization of time. The antisymmetric part of the second level is the signed area
      enclosed by a pair of coordinates, which measures hysteresis between them: whether one channel
      systematically leads the other around the loop within the window.
    formal_equations: "S(X)^{i,j}_{a,b} = double integral dX^i dX^j; Levy area A^{ij} = (S^{ij} - S^{ji})/2; S(X o psi) = S(X) for any reparametrization psi"
    assumptions:
      - "Channels are on comparable scales, or the largest-variance channel dominates every area."
      - "Speed genuinely is nuisance; when it is not, time must be added as an explicit channel."
    market_types: [clob_equities, clob_futures, clob_crypto, perp_dex]
    relevant_horizons: [seconds, minutes, hours]
    required_observables: [mid_price_series, signed_volume]
    required_data_resolution: "Aligned channels at event or fine time granularity within a window."
    expected_empirical_signature: >
      Signatures computed on the same window sampled two different ways agree exactly, while
      conventional lagged features disagree; the price-versus-flow Levy area changes sign between
      regimes where flow leads price and regimes where it follows.
    alternative_explanations:
      - "A non-zero Levy area can be produced by a common driver moving both channels with different response speeds, with neither leading the other causally."
    known_failure_modes:
      - "Invariance to speed is also blindness to speed: two windows with identical shape and very different urgency have identical signatures."
      - "Truncation at level two sees only pairwise hysteresis; genuinely higher-order structure needs deeper levels, at a cost growing as d^k."
      - "Unnormalized channels make the area a scale artifact rather than a relationship."
    source_passage_ids:
      - "chevyrev-2016-signature-method-primer#s2"
    contradicting_concept_ids: []
    alternative_note: "Held to account by its alternative explanation and failure modes; the invariance itself is a theorem, not a contested claim."
    supporting_concept_ids: [KC-MICRO-OFI]
    implementation_status: implemented
    confidence: 0.55
    problem_ids: [PB-ADVERSE-ENTRY, PB-ABSORPTION, PB-REGIME-BREAK]
    tags: [signatures, rough-paths, lead-lag, clock-free, read-directly]

  # ----------------------------------------------------------------------------
  # Workstream concepts. Each is anchored to a unit someone opened — venue
  # documentation or our own schema — rather than to a remembered result. They
  # exist because the problem map named four workstream failure modes that no
  # card addressed, which `knowledge status` reported as uncovered.
  # ----------------------------------------------------------------------------

  - concept_id: KC-BATCH-PRIORITY
    canonical_name: "Batch type-priority replaces arrival-time priority"
    plain_description: >
      On a venue that applies actions in consensus batches, the order in which actions take effect
      is decided first by what kind of action each one is, and only then by anything resembling
      arrival. Two orders sent milliseconds apart can be applied in the opposite order, and a cancel
      sent after an aggressive order can still take effect before it.
    mechanism: >
      HyperCore sorts the actions inside a batch by a fixed hierarchy — orders carrying neither GTC
      nor IOC first, then cancels, then orders carrying GTC or IOC — with proposer order breaking
      ties inside each category. Price-time priority still governs the resting book, but the time
      that matters is the batch boundary rather than the instant of arrival. The consequence is
      structural rather than statistical: a maker's cancel is applied before every aggressive order
      in the same batch, whenever it arrived, so a class of adverse fills that a continuous venue
      would impose cannot occur here.
    formal_equations: "execution rank = sort by (category, proposer index); category in {0: no GTC/IOC, 1: cancel, 2: GTC/IOC}; displacement = arrival rank - execution rank"
    assumptions:
      - "Actions are grouped into the batch we think they are; one or two batches per block means the boundary is short and misassignment is easy."
      - "The published hierarchy is what the matcher applies, and it does not change without notice."
      - "Proposer order within a category is not something we can predict or influence."
    market_types: [perp_dex]
    relevant_horizons: [tick, seconds]
    required_observables: [l2_book, trade_prints, sequence_metadata]
    required_data_resolution: "Action-level feed with enough sequencing information to reconstruct batch boundaries."
    expected_empirical_signature: >
      Realized fill and mark-out that depend on action category and on intra-batch rank, and that
      are not explained by continuous-time queue position; specifically, a lower realized adverse
      selection on resting orders than the continuous-time calculation predicts, concentrated in
      the batches where a cancel and an aggressive order coincide.
    alternative_explanations:
      - "The batch interval is short relative to the horizon being traded, so the reordering averages out and the continuous model describes the outcome adequately after all."
      - "Any measured maker advantage comes from latency to the proposer rather than from the category hierarchy, and would vanish under a different proposer."
    known_failure_modes:
      - "Batch boundaries are not published as such and must be reconstructed; a wrong reconstruction moves actions between batches and destroys the whole calculation."
      - "The protection is an opportunity, not a saving: whether the aggressive order would have matched that specific resting order needs price and size, which the ordering alone does not give."
      - "Applies to this venue only. Importing the conclusion to a continuous venue inverts it, because there the late cancel loses."
      - "Two batches per block means an action can still lose to an action that arrived later in the previous batch."
    source_passage_ids:
      - "hyperliquid-api-docs#hypercore-order-book"
    contradicting_concept_ids: [KC-MICRO-QUEUE]
    supporting_concept_ids: []
    implementation_status: implemented
    confidence: 0.6
    problem_ids: [PB-BATCH-PRIORITY, PB-FILL-UNCERTAINTY]
    tags: [queueing, batch-auction, priority, fill-probability, onchain, read-directly]
    workstream: hyperliquid_l4

  - concept_id: KC-PHANTOM-DEPTH
    canonical_name: "Displayed depth is an upper bound on executable depth"
    plain_description: >
      Resting size that is visible in the book may not execute, because the account behind it is
      re-checked for margin at the moment it would match. Depth that fails that check disappears
      exactly when it is needed, so slippage models built on the displayed book are biased in the
      state where the estimate matters most.
    mechanism: >
      Margin is checked when an order is placed and again for the resting side at each match. An
      account whose collateral has deteriorated since placement still displays its orders, but those
      orders fail at match time. Because collateral deteriorates when prices move, the failures
      concentrate in exactly the volatile states in which an aggressor is walking the book.
    formal_equations: "executable fraction = filled / displayed over levels the sweep passed through; slippage_from_phantom = realized VWAP - VWAP the displayed book predicted"
    assumptions:
      - "The book snapshot used is the last one strictly before the order was sent, with no sequence gap."
      - "The sweep is large enough to pass through at least one level, so that level is genuinely tested."
      - "Displayed size is not systematically hidden or iceberged in the other direction."
    market_types: [perp_dex]
    relevant_horizons: [tick, seconds]
    required_observables: [l2_book, trade_prints, sequence_metadata]
    required_data_resolution: "Level-2 snapshots with per-level size, and the fills attributable to a single aggressive order."
    expected_empirical_signature: >
      Realized consumption below displayed size at levels the sweep passed through, rising with
      volatility and with the leverage of the accounts resting at those levels, and distinct from
      the pattern that ordinary cancellation produces.
    alternative_explanations:
      - "Ordinary cancellation in the same batch removes the size for reasons unrelated to margin, and looks identical from the feed alone."
      - "The snapshot was stale or a sequence gap was missed, so the depth was never there at the decision time."
      - "Self-trade prevention removed the resting order, which is neither a margin failure nor a cancel."
    known_failure_modes:
      - "The deepest level a sweep reaches is partially consumed by design; counting it as phantom reports phantom depth on every sweep that ever stopped."
      - "Cannot separate a margin failure from a cancel without the account state behind each resting order, and that separation is the whole claim."
      - "A sweep that fills more than displayed reads as a realization above one, which is hidden liquidity rather than an error."
    source_passage_ids:
      - "hyperliquid-api-docs#hypercore-order-book"
    contradicting_concept_ids: []
    alternative_note: "Held to account by its alternative explanations: the observable shortfall is shared by cancellation, stale data and self-trade prevention, and the margin channel is only one of them."
    supporting_concept_ids: [KC-BATCH-PRIORITY]
    implementation_status: implemented
    confidence: 0.45
    problem_ids: [PB-PHANTOM-LIQUIDITY, PB-IMPACT-TIMING]
    tags: [phantom-liquidity, margin, depth, onchain, read-directly]
    workstream: hyperliquid_l4

  - concept_id: KC-EVENT-TREE-CONSTRAINTS
    canonical_name: "The logical constraint set is metadata, and the protocol enforces part of it"
    plain_description: >
      Which prediction markets must be consistent with each other is already recorded in the venue's
      event structure, so the constraint set can be enumerated rather than discovered by reading
      questions. A subset of those constraints is enforced by the token layer, and mispricing cannot
      persist there — which means the tradable surface is the unenforced complement, known in advance.
    mechanism: >
      Markets are keyed to an event, and outcomes within a negative-risk event are connected by a
      conversion that exchanges one NO token for YES tokens in the event's other outcomes. That
      conversion mechanically enforces the partition: a complete set can be assembled or dissolved
      for collateral in a single transaction, so a partition that fails to sum to one is arbitrageable
      without leg risk and is therefore competed away. Where no such conversion exists, the same
      relation holds only by convention and a breach can survive.
    formal_equations: "For an exhaustive outcome set O: sum_{o in O} P(o) = 1; enforced iff the token layer admits split/merge or the negative-risk conversion across O"
    assumptions:
      - "Markets sharing an event id are genuinely mutually exclusive and exhaustive, which the metadata asserts and the resolution criteria decide."
      - "The grouping in force at the decision timestamp is the one used; events are re-scoped and markets are added mid-life."
      - "All members are quoted at the same instant, so a stale leg is not manufacturing the breach."
    market_types: [prediction_market]
    relevant_horizons: [minutes, hours, days]
    required_observables: [market_probability, event_tree]
    required_data_resolution: "Market snapshots carrying event and series identifiers, quoted close enough together to be treated as simultaneous."
    expected_empirical_signature: >
      Partition sums that depart from one materially more often, and for materially longer, on
      relations the protocol does not enforce than on relations it does; and a cross-venue link,
      through the tracked instrument, whose consistency is not enforced at all.
    alternative_explanations:
      - "A gap that never closes is usually a resolution-criteria difference rather than a mispricing: the markets are not the partition the metadata says they are."
      - "Apparent breaches concentrate in illiquid events where the quote is not executable in size, so the constraint is satisfied at any price anyone could actually trade."
    known_failure_modes:
      - "Event grouping is a venue convention. Treating every group as a partition manufactures constraints that never existed, and no amount of price data reveals the error."
      - "A market that resolves early leaves a stale member whose price is pinned, which reads as a permanent breach that no trade captures."
      - "Enforcement is about the token layer only. A constraint can be economically tight without being protocol-enforced, and this account calls it free."
      - "Deriving implications, as opposed to partitions, needs a threshold or nesting field the snapshot schema does not carry."
    source_passage_ids:
      - "polymarket-clob-docs#conditional-token-framework"
      - "dxai-hyperliquid-ingest#polymarket-snapshots"
