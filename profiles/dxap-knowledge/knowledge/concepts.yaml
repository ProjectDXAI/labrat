  - concept_id: KC-IRREVERSIBILITY
    canonical_name: "Time-asymmetry of a price series, and what it does and does not imply"
    plain_description: >
      A series whose statistics differ when played backwards has an arrow of time. Every equity
      series that has been measured this way shows some asymmetry, so its presence is not the
      finding; the differences between instruments and across periods are.
    mechanism: >
      Reversible dynamics arise from equilibrium-like processes where no direction is preferred.
      Asymmetry requires a directed mechanism — order flow that begets order flow, slow build and
      fast unwind, or asymmetric response to gains and losses — so the degree of asymmetry is a
      summary of how much directed structure the process carries.
    formal_equations: "JS divergence between ordinal pattern distributions of x_t and of its reversal, judged against a surrogate population"
    assumptions:
      - "The window is long enough that the finite-length bias is small; published work uses windows of thousands of points."
      - "The comparison is made against surrogates, not against zero."
    market_types: [any]
    relevant_horizons: [minutes, hours, days]
    required_observables: [mid_price_series]
    required_data_resolution: "A regularly sampled series, thousands of points per estimate."
    expected_empirical_signature: >
      Divergence clearly above a shuffled null, varying substantially across instruments and
      fluctuating over time, and essentially uncorrelated with volatility.
    alternative_explanations:
      - "Deterministic session structure — auctions, funding settlements, daily cycles — produces asymmetry with no exploitable content."
      - "Ordinary linear autocorrelation can move the statistic without any genuine time asymmetry, because the shuffled null destroys correlation too."
    known_failure_modes:
      - "The link from asymmetry to predictability is asserted in the literature but not established; the authors who measured it say so explicitly."
      - "Short windows manufacture apparent asymmetry through sampling noise alone."
      - "Ordinal patterns are blind to magnitude, so an asymmetry that lives in sizes rather than in orderings is invisible."
    source_passage_ids:
      - "flanagan-2016-irreversibility-financial#empirical-ranking"
      - "martinez-2018-tirop#method"
    contradicting_concept_ids: []
    alternative_note: "Kept honest by its alternative explanations rather than by an opposing card; no published account argues markets are time-reversible."
