# The problem map.
#
# Compilation starts from diagnosed agent failure modes, not from "quant finance"
# as an undifferentiated topic. Every concept card must name at least one problem
# it addresses, and the compile queue seeds its personalized PageRank here — so a
# work is ranked by proximity to a problem we actually have, not by prestige.
#
# `buckets` and `tags` connect a problem to the corpus bibliography.

# The three concrete workstreams this knowledge base serves. Literature that does
# not touch one of these is not neutral, it is a distraction — the verticals below
# exist to keep the corpus pointed at them.
workstreams:
  polymarket:
    name: "Prediction markets on Polymarket"
    venue_mechanics: >
      Central limit order book, not a scoring-rule maker, so LMSR-based reasoning does not price
      the cost of moving the market. Positions are Gnosis Conditional Token Framework ERC-1155
      outcome tokens: splitting collateral mints a complete set, and merging a complete set returns
      collateral atomically. Negative-risk markets add a conversion that exchanges one NO token for
      YES tokens in the event's other outcomes.
    why_it_shapes_the_corpus: >
      The atomic split and merge mean logical arbitrage across related markets does not carry the
      leg risk that the cross-market literature assumes. The combinatorial structure is explicit in
      the token layer rather than inferred, which makes transport-style joint bounds executable
      rather than merely descriptive.
    reading_priorities: [economics_information, mathematical_foundations, exchange_documentation]

  hyperliquid_l4:
    name: "L4 limit order book research on Hyperliquid"
    venue_mechanics: >
      Fully on-chain central limit order book with price-time priority, but actions are sorted
      within each consensus batch by a deterministic hierarchy — orders without GTC or IOC first,
      then cancels, then orders carrying GTC or IOC — with proposer order breaking ties inside each
      category, and usually one or two batches per block. Margin is checked when an order opens and
      again for the resting side at each match.
    why_it_shapes_the_corpus: >
      Almost every order-book model in the literature assumes continuous time and true arrival-time
      priority. This venue is a discrete batch with a type-based priority hierarchy, so the standard
      queueing results describe a different system than the one we trade. L4 visibility also makes
      queue position an observable rather than an estimate, which turns several modelling
      assumptions into testable claims.
    reading_priorities: [queueing_networks, market_microstructure, mathematical_foundations, exchange_documentation]

  dxap_agents:
    name: "LLM-based agentic asset managers on Hyperliquid"
    venue_mechanics: >
      Agents make sequential decisions with tool access, memory and triggers, against the same
      venue. Their decisions are path dependent, and their outcomes mature slowly relative to the
      rate at which they act.
    why_it_shapes_the_corpus: >
      This is what the retrieval layer serves and what the attribution ledger measures. It makes
      causal inference, off-policy evaluation and anytime-valid monitoring first-order rather than
      methodological garnish, because the alternative is trusting an agent's own account of why it
      acted.
    reading_priorities: [inference_causality, decision_sequential, machine_learning_frontier]

# Observables the warehouse actually carries, read from the ingest schema at
# migrations/00001 and 00015. A concept card requiring anything not on this list is
# untestable for us today, however good the mechanism is.
observables_available:
  hyperliquid:
    - l2_book            # px, sz AND order_count per level
    - l1_book            # bbo with bid_count and ask_count
    - trade_prints       # side, px, sz, tid
    - counterparty_ids   # buyer and seller addresses on every fill — rare, and unused so far
    - mid_price_series
    - mark_price
    - oracle_price       # drives funding and liquidation on this venue
    - funding_rate
    - open_interest
    - sequence_metadata  # connection_id and sequence, for gap detection
  polymarket:
    - market_probability
    - event_tree         # event_id, event_ticker, series_id, series_ticker
    - cross_asset_link   # mentioned_symbols and tracked_coin, linking to traded instruments
    - liquidity_and_volume
  not_captured:
    - queue_position     # order count per level is available; own-order queue rank is not
    - order_lifecycle    # individual order add/cancel events are not in this pipeline
    - fee_schedule       # not a captured column; must be supplied by the caller

verticals:
  execution_cost:
    name: "Execution, adverse selection and fee drag"
    expected_artifacts:
      - entry adverse-selection diagnostics
      - execution-quality decomposition
      - conditions under which apparent alpha sits below expected cost
      - fill- and spread-aware abstention evidence
  stopping:
    name: "Optimal stopping, exits and giveback"
    expected_artifacts:
      - continuation-value estimates
      - probability of a new favourable excursion
      - evidence that a position's original thesis has decayed
      - path-dependent exit diagnostics rather than fixed trailing stops
  information_arrival:
    name: "Information arrival and structural change"
    expected_artifacts:
      - separation of transient flow from state change
      - catalyst-to-price absorption estimates
      - posterior updating across source types
      - regime-sensitive interpretation of momentum and reversal
  probability_formation:
    name: "Prediction-market and cross-market probability formation"
    expected_artifacts:
      - decomposition of fundamental probability change versus liquidity movement
      - stale-probability detection
      - participant and order-flow informativeness hypotheses
      - cross-market consistency tests

problems:
  - problem_id: PB-COST-DRAG
    vertical: execution_cost
    statement: "Turnover is high enough that fees, funding and spread consume the edge the agent believes it has."
    observed_signature: "Positive gross edge, negative net after fees; short holding periods clustered around low-conviction entries."
    weight: 1.0
    buckets: [market_microstructure, quant_finance_core, defi_mechanics]
    tags: [execution, impact, adverse-selection, fee-drag]

  - problem_id: PB-ADVERSE-ENTRY
    vertical: execution_cost
    statement: "Entries are systematically filled just before the price moves against them."
    observed_signature: "Negative mark-out at 1-30s after fill; worse on aggressive orders into thin books."
    weight: 1.0
    buckets: [market_microstructure, queueing_networks, mathematical_foundations]
    tags: [adverse-selection, order-book, queueing, impact]

  - problem_id: PB-IMPACT-TIMING
    vertical: execution_cost
    statement: "Large orders are worked without a model of how impact decays, so the schedule is either too fast or too slow."
    observed_signature: "Realized shortfall dominated by temporary impact; price reverts after completion."
    weight: 0.9
    buckets: [market_microstructure, optimal_control, operations_research, machine_learning_frontier]
    tags: [execution, impact, resiliency]

  - problem_id: PB-GIVEBACK
    vertical: stopping
    statement: "Winning positions give back most of their maximum favourable excursion before the agent exits."
    observed_signature: "High MFE, low realized capture; exits triggered by drawdown rather than by thesis decay."
    weight: 1.0
    buckets: [decision_sequential, optimal_control, inference_causality]
    tags: [optimal-stopping, exit, hazard]

  - problem_id: PB-THESIS-DECAY
    vertical: stopping
    statement: "The agent holds after the conditions that justified entry have stopped holding."
    observed_signature: "Position rationale references a catalyst whose effect has already been absorbed."
    weight: 0.9
    buckets: [decision_sequential, signal_processing]
    tags: [changepoint, regime, exit]

  - problem_id: PB-REGIME-BREAK
    vertical: information_arrival
    statement: "Transient flow is read as a state change, and genuine state changes are read as noise."
    observed_signature: "Reversals taken during trending regimes; trend-following entries at regime ends."
    weight: 1.0
    buckets: [signal_processing, detection_tracking, dynamical_systems, high_dim_statistics]
    tags: [changepoint, regime, filtering, detection]

  - problem_id: PB-ABSORPTION
    vertical: information_arrival
    statement: "The agent cannot tell whether a catalyst is already in the price."
    observed_signature: "Entries after the move has been absorbed; no estimate of absorption speed by venue or instrument."
    weight: 0.9
    buckets: [economics_information, market_microstructure]
    tags: [information, absorption, catalyst, price-discovery]

  - problem_id: PB-STALE-PROBABILITY
    vertical: probability_formation
    statement: "Prediction-market prices are treated as current beliefs when they may simply be unrefreshed."
    observed_signature: "Trades against a price that has not updated since the last relevant news, with thin recent flow."
    weight: 1.0
    buckets: [economics_information, exchange_documentation]
    tags: [prediction-market, polymarket-relevant, information, liquidity]

  - problem_id: PB-XMARKET
    vertical: probability_formation
    statement: "Related instruments across venues are priced inconsistently and the agent has no consistency test."
    observed_signature: "Simultaneous positions implying contradictory probabilities; no funding- or fee-adjusted comparison."
    weight: 0.8
    buckets: [economics_information, exchange_documentation, network_science, defi_mechanics]
    tags: [cross-market, arbitrage, prediction-market, funding]

  - problem_id: PB-FILL-UNCERTAINTY
    vertical: execution_cost
    statement: "Passive orders are assumed to fill; queue position and cancellation dynamics are ignored."
    observed_signature: "Planned passive entries that never fill, followed by aggressive chases at worse prices."
    weight: 0.8
    buckets: [queueing_networks, market_microstructure]
    tags: [queueing, order-book, fill-probability]

  - problem_id: PB-INVENTORY-FUNDING
    vertical: execution_cost
    statement: "Inventory and funding costs are not priced into quoting or holding decisions on perpetuals."
    observed_signature: "Positions held through adverse funding; no inventory skew in quoting."
    weight: 0.8
    buckets: [market_microstructure, operations_research, defi_mechanics]
    tags: [inventory, funding, market-making]

  # Workstream-specific problems, added once the venue mechanics were read directly.
  - problem_id: PB-BATCH-PRIORITY
    vertical: execution_cost
    workstream: hyperliquid_l4
    statement: "Order placement assumes arrival-time priority, but the venue sorts actions within a consensus batch by order type before proposer order."
    observed_signature: "Passive placements that model queue position by arrival time mispredict fills; cancels and post-only placements interact in ways a continuous-time model does not represent."
    weight: 1.0
    buckets: [queueing_networks, market_microstructure, exchange_documentation, mathematical_foundations]
    tags: [queueing, batch-auction, priority, fill-probability, onchain]

  - problem_id: PB-PHANTOM-LIQUIDITY
    vertical: execution_cost
    workstream: hyperliquid_l4
    statement: "Resting liquidity may fail its margin check at match time, so displayed depth overstates executable depth by an unknown amount."
    observed_signature: "Aggressive orders that consume less than the displayed depth; slippage worse than the book predicted."
    weight: 0.9
    buckets: [market_microstructure, exchange_documentation, queueing_networks]
    tags: [phantom-liquidity, margin, depth, onchain]

  - problem_id: PB-LOGICAL-ARB
    vertical: probability_formation
    workstream: polymarket
    statement: "Logically related markets are priced inconsistently, and the token layer offers an atomic settlement path that the pricing does not reflect."
    observed_signature: "Complete sets trading away from par; partitions not summing to one; implications inverted across related questions."
    weight: 1.0
    buckets: [economics_information, mathematical_foundations, exchange_documentation]
    tags: [prediction-market, arbitrage, conditional-tokens, polymarket-relevant]

  - problem_id: PB-AGENT-ATTRIBUTION
    vertical: stopping
    workstream: dxap_agents
    statement: "An agent's stated reason for a decision is not evidence that the reason caused the decision, and outcomes mature far more slowly than the agent acts."
    observed_signature: "Self-reported use of a concept with no corresponding change in tool calls or actions; performance claims made before outcomes matured."
    weight: 1.0
    buckets: [inference_causality, decision_sequential, machine_learning_frontier]
    tags: [attribution, off-policy-evaluation, anytime-valid, agentic]
