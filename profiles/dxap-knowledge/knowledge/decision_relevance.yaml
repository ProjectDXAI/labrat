# Decision-relevance cards.
#
# These connect a mechanism to a decision without turning a theoretical claim into
# a mandatory strategy. Each card states what evidence would support the action and
# what would argue against it, plus the confidence below which the concept should
# not move the decision at all.
#
# A card that only lists supporting evidence is a prompt rule with a citation
# attached. The validator lints for unconditional directive language for the same
# reason.

decision_relevance:
  - decision_relevance_id: DR-OFI-ENTRY
    concept_id: KC-MICRO-OFI
    decision_type: entry
    evidence_that_would_support_action: >
      Trailing-window OFI agrees in sign with the intended entry direction, its magnitude is large
      relative to displayed depth, and the imbalance has persisted across several updates rather
      than appearing in one.
    evidence_that_would_argue_against_action: >
      The imbalance is one snapshot deep, coincides with a scheduled mechanical flow, or sits on a
      venue whose book is a partial view of consolidated liquidity.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Encourages aggressive entries; check the cost floor before acting on a short-horizon signal."

  - decision_relevance_id: DR-COST-ENTRY
    concept_id: KC-COST-FLOOR
    decision_type: entry
    evidence_that_would_support_action: >
      Estimated gross edge exceeds the decision-time round-trip floor with margin for estimation
      error, using the live fee tier and funding rate rather than averages.
    evidence_that_would_argue_against_action: >
      The spread at decision time is wide relative to the recent distribution, funding carry over
      the intended hold is material, or the edge estimate rests on a mark-out sample too small to
      separate from zero.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Applied strictly, it reduces turnover; confirm that the surviving trades are not simply the slowest ones."

  - decision_relevance_id: DR-COST-ABSTAIN
    concept_id: KC-COST-FLOOR
    decision_type: abstain
    evidence_that_would_support_action: >
      The floor exceeds the estimated edge, and the same has held across the recent comparable
      decisions rather than for this one instrument.
    evidence_that_would_argue_against_action: >
      The floor estimate is dominated by an adverse-selection term with wide error bars, or the
      position would have been entered for a reason other than the modelled edge.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Abstention has an opportunity cost that is invisible in the ledger unless it is recorded."

  - decision_relevance_id: DR-MECHANICAL-ABSTAIN
    concept_id: KC-MICRO-MECHANICAL-FLOW
    decision_type: abstain
    evidence_that_would_support_action: >
      The imbalance coincides with a known mechanical event — funding settlement, index rebalance,
      liquidation cascade — and prior instances of the same event reverted within the horizon.
    evidence_that_would_argue_against_action: >
      The flow continues past the mechanical window, or related instruments move in the same
      direction without the same constraint.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Classifying flow as mechanical after the move is trivial and predicts nothing; the call must be made ex ante."

  - decision_relevance_id: DR-QUEUE-ENTRY
    concept_id: KC-MICRO-QUEUE
    decision_type: entry
    evidence_that_would_support_action: >
      Estimated queue position is near the front, the level has depth behind it, and cancellation
      intensity at the level has been stable.
    evidence_that_would_argue_against_action: >
      Position is deep in the queue, the level is thinning, or the venue uses pro-rata allocation
      so queue position carries little information.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Front-of-queue orders fill more often, which raises turnover as well as fill quality."

  - decision_relevance_id: DR-KYLE-SIZING
    concept_id: KC-INFO-KYLE
    decision_type: sizing
    evidence_that_would_support_action: >
      A recently estimated lambda with acceptable fit lets expected impact be priced into the size,
      and the intended size sits in the range where the linear fit was estimated.
    evidence_that_would_argue_against_action: >
      Fit quality is poor, the estimation window crosses a volatility regime break, or the intended
      size is far outside the estimated range where concave impact would dominate.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "A lambda fitted in a concave regime understates the cost of large orders."

  - decision_relevance_id: DR-SQRT-SIZING
    concept_id: KC-IMPACT-SQRT
    decision_type: sizing
    evidence_that_would_support_action: >
      Intended participation is high enough that concave scaling dominates, and recent parent-order
      records support the exponent used.
    evidence_that_would_argue_against_action: >
      The order is small relative to displayed depth, or the impact records come from a different
      venue type than the one being traded.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Concave scaling makes large orders look cheaper; pair it with a decay model or transient impact is booked as permanent."

  - decision_relevance_id: DR-AC-EXIT
    concept_id: KC-EXEC-AC
    decision_type: exit
    evidence_that_would_support_action: >
      The exit is large relative to displayed depth, volatility over the horizon is estimable, and
      no catalyst is expected inside the schedule.
    evidence_that_would_argue_against_action: >
      Information is arriving during the exit, impact looks concave in this instrument, or the
      horizon is short enough that scheduling adds little over immediate execution.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "A schedule keeps trading after the thesis decays unless a stopping check runs alongside it."

  - decision_relevance_id: DR-MM-SIZING
    concept_id: KC-MM-INVENTORY
    decision_type: sizing
    evidence_that_would_support_action: >
      Inventory is material relative to risk limits, volatility is estimable on the quoting clock,
      and two-sided arrival intensity is roughly symmetric.
    evidence_that_would_argue_against_action: >
      The book is one-sided, funding carry dominates the inventory term, or the model's optimal
      spread is narrower than the venue tick.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Skewing quotes to shed inventory increases fill rate on the side you least want filled during a trend."

  - decision_relevance_id: DR-STOP-HOLD
    concept_id: KC-STOP-CONTINUATION
    decision_type: hold
    evidence_that_would_support_action: >
      Estimated continuation value exceeds exit value at decision-time exit cost, with enough
      comparable matured episodes behind the estimate to distinguish it from the base rate.
    evidence_that_would_argue_against_action: >
      Support in the conditioning bucket is thin, the exit cost estimate uses average rather than
      current depth, or the regime differs from the episodes the estimate came from.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "The comparison is only as good as the episode history; a policy change invalidates the history it was measured under."

  - decision_relevance_id: DR-STOP-EXIT
    concept_id: KC-STOP-CONTINUATION
    decision_type: exit
    evidence_that_would_support_action: >
      Continuation value has fallen below exit value including cost, and the state variables driving
      it were available before the current bar rather than reconstructed.
    evidence_that_would_argue_against_action: >
      A persistence regime is in force, in which case the truncated tail is where the return lives.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Exiting on the crossing raises turnover and therefore the cost floor the strategy must clear."

  - decision_relevance_id: DR-PERSIST-HOLD
    concept_id: KC-REGIME-PERSISTENCE
    decision_type: hold
    evidence_that_would_support_action: >
      A persistence estimate computed out of sample is in force, and position sizing can survive the
      giveback that holding implies.
    evidence_that_would_argue_against_action: >
      Persistence was estimated in sample, or the position is a loser being justified by an argument
      built for winners.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "This concept can rationalise holding almost anything; require the regime test to be pre-registered."

  - decision_relevance_id: DR-FILTER-HOLD
    concept_id: KC-FILTER-STATE
    decision_type: hold
    evidence_that_would_support_action: >
      Normalized innovations are near their expected magnitude, so the state estimate the thesis
      depends on is still consistent with the data.
    evidence_that_would_argue_against_action: >
      A run of large normalized innovations, or a noise variance that has been tuned until the
      diagnostic looked acceptable.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Filtered estimates lag by construction; at short horizons the lag can exceed the decision window."

  - decision_relevance_id: DR-CUSUM-EXIT
    concept_id: KC-DETECT-CUSUM
    decision_type: exit
    evidence_that_would_support_action: >
      The detector alarms against the position direction with parameters tuned on a disjoint period,
      and the alarm is not explained by a scheduled event.
    evidence_that_would_argue_against_action: >
      Alarm rate is high enough that most alarms are noise, or the reference window already contained
      the shift, making the alarm late and uninformative.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Acting on every alarm converts a detection statistic into a high-turnover exit policy."

  - decision_relevance_id: DR-ABSORB-ENTRY
    concept_id: KC-INFO-ABSORPTION
    decision_type: entry
    evidence_that_would_support_action: >
      The catalyst timestamp is reliable, the estimated absorbed fraction is well below one, and the
      instrument's historical absorption profile is slow enough to leave room.
    evidence_that_would_argue_against_action: >
      Overlapping catalysts make the response non-identifiable, or the move has already matched the
      instrument's typical full response.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Entering into an absorbing move competes with informed flow that is already working."

  - decision_relevance_id: DR-LMSR-SIZING
    concept_id: KC-PRED-LMSR
    decision_type: sizing
    evidence_that_would_support_action: >
      The venue runs a scoring-rule maker, the implied liquidity parameter is stable across recent
      trades, and the cost of moving the price to the target probability is affordable.
    evidence_that_would_argue_against_action: >
      The venue is an order book rather than a scoring-rule maker, or the liquidity parameter was
      estimated across a resolution-relevant event.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Sizing to the cost curve concentrates risk in the markets that are cheapest to move, which are also the thinnest."

  - decision_relevance_id: DR-STALE-ENTRY
    concept_id: KC-PRED-LIQUIDITY-MOVE
    decision_type: entry
    evidence_that_would_support_action: >
      The price move consumed most of the visible depth and has not been confirmed by replenished
      flow, and related markets have not moved.
    evidence_that_would_argue_against_action: >
      Depth has replenished at the new level, or the single participant plausibly held information
      the thin book made cheap to express.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Fading a liquidity move means standing in front of whoever caused it, if they were right."

  - decision_relevance_id: DR-XMKT-ENTRY
    concept_id: KC-XMKT-CONSISTENCY
    decision_type: entry
    evidence_that_would_support_action: >
      Both venues' resolution rules have been read and agree, quotes are synchronized, and the gap
      survives fees, funding carry to resolution, and execution cost on both legs.
    evidence_that_would_argue_against_action: >
      One leg's quote is stale, the resolution sources differ, or margin requirements prevent holding
      both legs to resolution.
    minimum_required_confidence: 0.65
    important_side_effects:
      - "A one-legged fill converts a hedged position into an outright one, which is the usual way this loses money."

  - decision_relevance_id: DR-CRITICALITY-ABSTAIN
    concept_id: KC-HAWKES-CRITICALITY
    decision_type: abstain
    evidence_that_would_support_action: >
      Scale-local endogeneity is elevated relative to its own recent distribution at the same
      aggregation scale and with the same seasonality treatment, and the scale profile is stable
      rather than rising, so the reading is not a window artifact.
    evidence_that_would_argue_against_action: >
      The scale profile rises with aggregation, meaning the base estimate understates endogeneity
      and the comparison across time is not like for like; or the seasonality weight has changed.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Because the published estimate sits near one at all times, an abstention rule keyed to a level rather than to a change may abstain permanently."

  - decision_relevance_id: DR-IRREVERSIBILITY-SIZING
    concept_id: KC-IRREVERSIBILITY
    decision_type: sizing
    evidence_that_would_support_action: >
      The instrument's asymmetry is significant against surrogates and ranks high relative to the
      other instruments measured over the same window length.
    evidence_that_would_argue_against_action: >
      The divergence is not significant, the window is far shorter than the thousands of points the
      published work uses, or the asymmetry coincides with a known session artifact.
    minimum_required_confidence: 0.45
    important_side_effects:
      - "The link from asymmetry to profitability is unestablished; treat this as a research allocator, not a position sizer, until our own ledger says otherwise."

  - decision_relevance_id: DR-SIGNATURE-ENTRY
    concept_id: KC-SIGNATURE-PATH
    decision_type: entry
    evidence_that_would_support_action: >
      The price-versus-flow Levy area has the sign consistent with flow leading price, on normalized
      channels, and holds across two different samplings of the same window.
    evidence_that_would_argue_against_action: >
      The area is small relative to its distribution on shuffled channels, or a common driver
      plausibly explains both channels moving.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Signatures are blind to urgency; pair with an explicit speed measure before acting in fast markets."

  # Workstream decision cards.
  - decision_relevance_id: DR-BATCH-PASSIVE
    concept_id: KC-BATCH-PRIORITY
    decision_type: entry
    evidence_that_would_support_action: >
      The intended entry is passive on a venue that batches, the order carries no GTC or IOC so it
      lands in the first category, and reconstructed batches show cancels and aggressive orders
      coinciding often enough that the ordering has bitten in the recent past.
    evidence_that_would_argue_against_action: >
      Batch boundaries cannot be reconstructed with confidence, the intended holding period is long
      enough that intra-batch ordering averages out, or the measured advantage disappears once
      proposer identity is controlled for.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Encourages resting rather than crossing; check that the passive order fills often enough to be a strategy rather than an intention."
      - "The conclusion inverts on a continuous venue, where a late cancel loses. It must not be carried across."

  - decision_relevance_id: DR-PHANTOM-SIZING
    concept_id: KC-PHANTOM-DEPTH
    decision_type: sizing
    evidence_that_would_support_action: >
      Recent sweeps in this instrument show executable fractions below one at levels they passed
      through, the shortfall rises with volatility, and the book snapshots feeding the estimate are
      free of sequence gaps.
    evidence_that_would_argue_against_action: >
      The shortfall is the same in calm and volatile conditions, which points at ordinary cancellation;
      or it is smaller than a tick, in which case no sizing decision can act on it.
    minimum_required_confidence: 0.45
    important_side_effects:
      - "Discounting displayed depth shrinks intended size, which can turn a marginal edge into an abstention. That is the point, but it should be recorded as such."

  - decision_relevance_id: DR-PHANTOM-ABSTAIN
    concept_id: KC-PHANTOM-DEPTH
    decision_type: abstain
    evidence_that_would_support_action: >
      The trade needs more depth than the corrected estimate of executable size supports, and the
      correction is largest in exactly the volatility state now in force.
    evidence_that_would_argue_against_action: >
      The size could be worked over several batches rather than swept at once, which changes the
      question from executable depth to schedule.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Abstaining on depth grounds has an opportunity cost that is invisible unless the abstention is logged with its reason."

  - decision_relevance_id: DR-EVENT-TREE-ENTRY
    concept_id: KC-EVENT-TREE-CONSTRAINTS
    decision_type: entry
    evidence_that_would_support_action: >
      A partition derived from the event metadata departs from one by more than the settlement-aware
      cost hurdle, every member is quoted at the same instant, none has resolved, and the relation is
      one the protocol does not enforce — so the breach has somewhere to persist.
    evidence_that_would_argue_against_action: >
      The members' resolution criteria do not actually partition the outcome space, the quotes are not
      simultaneous, the depth behind them will not absorb the intended size, or the relation is
      protocol-enforced and the apparent gap is a stale quote rather than an opportunity.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Every leg is a position that must be carried to resolution; the capital cost of doing so is not in the consistency check."

  - decision_relevance_id: DR-ANYTIME-RETIRE
    concept_id: KC-ANYTIME-ATTRIBUTION
    decision_type: exit
    evidence_that_would_support_action: >
      The capital process against the null that this strategy still clears its costs has crossed the
      threshold, the observations entered in maturation order, and the unit of analysis is the unit
      that was randomized.
    evidence_that_would_argue_against_action: >
      The process crosses only when wakes rather than branch-days are counted, the outcomes were
      reordered, or the crossing coincides with a regime the strategy was not claimed to survive.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Retirement is hard to reverse in practice: the strategy stops generating the data that would show it recovered."

  - decision_relevance_id: DR-ANYTIME-ABSTAIN
    concept_id: KC-ANYTIME-ATTRIBUTION
    decision_type: abstain
    evidence_that_would_support_action: >
      The anytime interval on the effect still contains zero, so the honest position is that the
      treatment has not been shown to do anything and the decision should not lean on it.
    evidence_that_would_argue_against_action: >
      The interval is wide because the design has too little power rather than because the effect is
      absent, which is an argument for changing the experiment, not for suspending judgement forever.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Waiting is itself a choice with a cost; the number of decisions taken under the unresolved treatment should be counted."

  - decision_relevance_id: DR-COUNTERPARTY-ENTRY
    concept_id: KC-COUNTERPARTY-INFO
    decision_type: entry
    evidence_that_would_support_action: >
      The counterparties resting at the level we intend to take have training-window mark-outs near or
      below the pooled mean, their profiles rest on enough fills to survive shrinkage, and the ranking
      showed out-of-sample persistence in the most recent evaluation.
    evidence_that_would_argue_against_action: >
      The addresses at that level are unseen or thin, the persistence measured last period was near
      zero, or the ranking is plausibly proxying for speed and for the market states those
      counterparties choose to trade in.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Systematically declining to trade against flagged addresses changes their behaviour and ours, so the measured persistence degrades once it is acted on."

  # Decision cards for the transfers.
  - decision_relevance_id: DR-ALARM-ABSTAIN
    concept_id: KC-ALARM-LOSS
    decision_type: abstain
    evidence_that_would_support_action: >
      The detector's minimum loss on a held-out period is at or above one, meaning it performs
      no better than alarming at random, whatever its probability gain looks like at a tight
      threshold.
    evidence_that_would_argue_against_action: >
      The loss is below one at a moderate alarm fraction and the weighting used reflects what
      being in alarm actually costs us rather than the unweighted default.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Applied to our own retrieval policies, this is the diagnosis of an over-cautious threshold rather than a reason to raise it further."

  - decision_relevance_id: DR-ALARM-ENTRY
    concept_id: KC-ALARM-LOSS
    decision_type: entry
    evidence_that_would_support_action: >
      The current period sits above a threshold selected by minimising the loss on a disjoint
      period, and the probability gain at that threshold is quoted alongside the loss rather
      than instead of it.
    evidence_that_would_argue_against_action: >
      The threshold was selected on the same sample being evaluated, or it was chosen to maximise
      gain, in which case it fires so rarely that the sample supporting it is thin.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Lowering a threshold to reduce misses raises time in alarm, which has a real cost in attention and in premature entries."

  - decision_relevance_id: DR-CASCADE-SIZING
    concept_id: KC-CASCADE-HORIZON
    decision_type: sizing
    evidence_that_would_support_action: >
      The intended horizon is long enough for triggering to matter, the branching ratio is
      comfortably below one, and the scale profile does not warn that the estimate is a window
      artifact.
    evidence_that_would_argue_against_action: >
      The branching ratio is near one, where the multiplier is dominated by estimation error, or
      the decision only needs the direction of activity, where the source says the naive forecast
      carries nearly the same information.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Forecasting more activity is not forecasting a direction; higher expected volume is as consistent with being run over as with an opportunity."

  - decision_relevance_id: DR-COHERENCE-ENTRY
    concept_id: KC-JUDGMENT-AGGREGATION
    decision_type: entry
    evidence_that_would_support_action: >
      A partition breach sits on an event whose legs are priced by largely disjoint populations,
      the legs are genuinely logically connected, and the gap clears the settlement-aware hurdle.
    evidence_that_would_argue_against_action: >
      The same participants price every leg, in which case the aggregation has converged and a
      residual gap is more likely a resolution-criteria difference or an execution artifact than
      a mispricing.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "This licenses expecting incoherence, not trading it. It says nothing about which leg is wrong."

  - decision_relevance_id: DR-EARLY-WARNING-HOLD
    concept_id: KC-EARLY-WARNING-FRAGILITY
    decision_type: hold
    evidence_that_would_support_action: >
      Indicator trends are rising, the trend survives its own significance test against a
      surrogate, and residuals still carry structure so the rise is not an artifact of the
      detrending model.
    evidence_that_would_argue_against_action: >
      The detrending choice or window length was tuned until the signal appeared, or the move
      being anticipated is a shock rather than a bifurcation, which this says nothing about.
    minimum_required_confidence: 0.45
    important_side_effects:
      - "Acting on a warning that has not been tested against a null converts a high false-positive rate directly into turnover."

  - decision_relevance_id: DR-CAPACITY-SIZING
    concept_id: KC-STRATEGY-CAPACITY
    decision_type: sizing
    evidence_that_would_support_action: >
      Realised return per unit has fallen as deployed size rose, across enough size variation to
      see curvature, and the fall is not explained by execution quality over the same period.
    evidence_that_would_argue_against_action: >
      Size variation was chosen in response to performance, which makes the observed relationship
      run in the wrong direction, or the edge decayed for reasons unrelated to our own size.
    minimum_required_confidence: 0.45
    important_side_effects:
      - "Capacity is shared with everyone running the same strategy, so our own returns understate how close the crowd is to the limit."

  - decision_relevance_id: DR-PERP-BASIS-ENTRY
    concept_id: KC-PERP-BASIS
    decision_type: entry
    evidence_that_would_support_action: >
      The basis residual, after subtracting the level implied by the borrowing rate against
      funding intensity, is large relative to its own history, and the margin needed to hold the
      position through a plausible convergence time is available.
    evidence_that_would_argue_against_action: >
      The raw basis is wide but the residual is not, meaning the rates relationship explains it;
      or the residual is wide across every instrument at once, in which case it is one factor bet
      rather than a diversified set.
    minimum_required_confidence: 0.55
    important_side_effects:
      - "Convergence happens at a random time, so this consumes margin for an unknown period. Sizing it as a riskless arbitrage is how the trade fails."

  - decision_relevance_id: DR-PERP-BASIS-HOLD
    concept_id: KC-PERP-BASIS
    decision_type: hold
    evidence_that_would_support_action: >
      The residual has not closed but the rates inputs have not moved either, so the reason for
      the position still holds and the funding carried so far is within what was budgeted.
    evidence_that_would_argue_against_action: >
      The borrowing rate or funding intensity has moved enough that the fundamental level itself
      has shifted, which means the position is now sized against a level that no longer applies.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Holding through adverse funding is the cost this trade is built to earn; distinguishing that from a thesis that has broken needs the level recomputed, not the P&L watched."

  - decision_relevance_id: DR-ORACLE-ABSTAIN
    concept_id: KC-ORACLE-LAG
    decision_type: abstain
    evidence_that_would_support_action: >
      The market-oracle wedge is wide, which is where mechanical liquidation flow is about to
      arrive, and the intended entry would be on the side that flow will run over.
    evidence_that_would_argue_against_action: >
      The wedge is within its normal range for this volatility level, or our own data path
      latency has not been ruled out as the source of the apparent gap.
    minimum_required_confidence: 0.5
    important_side_effects:
      - "Abstaining around the wedge means standing aside exactly when volume is highest, which has an opportunity cost that should be recorded rather than assumed to be zero."

  - decision_relevance_id: DR-IMPACT-SIZING
    concept_id: KC-IMPACT-CONFLATION
    decision_type: sizing
    evidence_that_would_support_action: >
      The size being considered is priced against the measure that matches it: a metaorder worked
      over time against the metaorder curve, a single aggressive order against the single-order
      curve, and neither against an interval regression slope.
    evidence_that_would_argue_against_action: >
      The only coefficient available is an interval regression, which lives in the linear regime
      and will understate the cost of a large parent order and overstate the cost of a small one.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Correcting this raises estimated cost for large orders, which will reduce intended size. That is the intended consequence, not a side effect to be tuned away."

  - decision_relevance_id: DR-OFFLINE-ABSTAIN
    concept_id: KC-OFFLINE-SHIFT
    decision_type: abstain
    evidence_that_would_support_action: >
      The question is what the agent would have done under a treatment it was never run with, the
      only evidence is logged traces, and the evaluated policy departs enough from the logging one
      that most of its states are outside the logged distribution.
    evidence_that_would_argue_against_action: >
      Coverage can be checked and is adequate, or the claim being made is behavioural rather than
      economic, which is what fixed historical contexts can actually support.
    minimum_required_confidence: 0.6
    important_side_effects:
      - "Refusing an offline estimate leaves the question open until a randomized arm exists, which has a real cost in time and should be recorded rather than treated as free caution."
