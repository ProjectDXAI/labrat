# Structural findings: patterns in the mathematics, tracked as they are read.
#
# This file is the point of the corpus. Not "what may we license" and not "which
# trade does this justify" — what STRUCTURE keeps showing up, where the same
# object appears under two names in two fields, and where two literatures make
# quantitative claims that must be consistent and might not be.
#
# A finding may or may not touch the trading work. That is fine and expected;
# recording the pattern is the deliverable. Each entry carries an `agent_seed`:
# a paragraph written to be handed to a coding agent as creative direction when
# building in this area.
#
# `status` is the only quality gate that matters here:
#   read        — taken from primary material opened in this repository
#   tension     — two read sources make claims that may not be mutually consistent
#   conjecture  — a pattern proposed from what was read, not itself asserted anywhere

findings:

  - finding_id: FIND-EXPONENT-SELECTS-MODEL
    title: "One microstructural exponent selects the entire macroscopic volatility model class"
    status: read
    structure: "Scaling limits of nearly unstable Hawkes processes, indexed by the kernel's tail exponent."
    domains: [point_processes, quant_finance_core, dynamical_systems]
    correspondence: >
      Take a self-exciting process whose kernel L1 norm approaches one. If the kernel is light
      tailed, the rescaled limit is an integrated Cox-Ingersoll-Ross process and the price model
      converges to Heston. If instead the kernel has power-law tails of the form x^-(1+alpha) with
      alpha in (1/2, 1), the limit is an integrated FRACTIONAL CIR process with Hurst parameter
      H = alpha - 1/2. The same construction, differing only in the tail of the excitation kernel,
      lands in two different model classes.
    what_it_buys: >
      The kernel tail exponent is not a nuisance parameter to be integrated out. It is the model
      selector. Every argument about whether volatility is rough is, under this construction, an
      argument about the tail of the order-flow excitation kernel — a microstructural quantity
      measurable from event timestamps alone, with no options data and no volatility proxy.
    sources_read:
      - "arXiv 1504.03100 — Jaisson and Rosenbaum, rough fractional diffusions as scaling limits of nearly unstable heavy tailed Hawkes processes"
      - "arXiv 1310.2033 — Jaisson and Rosenbaum, limit theorems for nearly unstable Hawkes processes"
    agent_seed: >
      When building anything that estimates volatility dynamics from high-frequency data, treat the
      excitation kernel tail as the primary parameter and the volatility model as derived. Estimate
      alpha first; let it choose between a Heston-class and a rough-class model rather than
      selecting the model by fit. Build the estimator so alpha is reported with its uncertainty, and
      so the implied H = alpha - 1/2 is carried alongside any volatility surface the system produces.
      Structure the code so the two model classes are two instantiations of one interface selected
      by a measured number, not two competing codepaths chosen by a flag.

  - finding_id: FIND-EXPONENT-TENSION
    title: "The measured kernel exponent and the measured volatility roughness do not obviously agree"
    status: tension
    structure: "A consistency condition, H = alpha - 1/2, between two independently measured quantities."
    domains: [point_processes, quant_finance_core]
    correspondence: >
      The scaling limit requires alpha in (1/2, 1) to produce roughness, and gives H = alpha - 1/2.
      Rough volatility work reports H near 0.1, which implies alpha near 0.6. Hardiman, Bercot and
      Bouchaud, fitting a power-law Hawkes kernel to E-mini mid-price changes, report decay
      exponents near -1.15 below about a thousand seconds and near -1.45 above it — that is, alpha
      near 0.15 and 0.45 in the same parameterization. Both sit below the 1/2 threshold at which the
      roughness regime begins.
    what_it_buys: >
      Either the empirical kernel is not in the regime the theorem requires, or the two-regime kernel
      means no single alpha applies, or one of the two measurements does not mean what the other
      assumes. All three possibilities are interesting, and the question appears not to have been
      asked because the two numbers live in different papers using different data and different
      estimators. It is directly checkable: measure both on one instrument over one period.
    sources_read:
      - "arXiv 1504.03100 — the H = alpha - 1/2 relation and the (1/2, 1) condition"
      - "arXiv 1302.1405 — measured kernel exponents of -1.15 and -1.45 across two regimes"
    open_question: >
      Does the consistency relation hold on any real instrument when both sides are estimated from
      the same data? If it fails, which side fails?
    agent_seed: >
      Build the cross-check as a first-class diagnostic rather than a study: a routine that takes one
      instrument and one period, estimates the Hawkes kernel exponent from event timestamps and the
      Hurst parameter from realized volatility, and reports both alongside the residual of
      H = alpha - 1/2. Treat a large residual as a signal that the model family is wrong for that
      instrument, not as an error to be tuned away. This is the shape of diagnostic worth having
      everywhere: two independent estimates of quantities a theorem says must be related, with the
      violation surfaced rather than reconciled.

  - finding_id: FIND-DISSIPATION-IS-NONPREDICTIVE-MEMORY
    title: "Memory that does not predict is exactly dissipated work"
    status: read
    structure: "An identity between thermodynamic dissipation and an information difference."
    domains: [information_theory, stochastic_thermodynamics, machine_learning_frontier]
    correspondence: >
      For a system whose state s_t responds to a driving signal x_t, define instantaneous memory as
      I_mem = I[s_t ; x_t] and instantaneous predictive power as I_pred = I[s_t ; x_{t+1}]. The
      central result is beta <W_diss> = I_mem - I_pred. The work irretrievably lost is precisely the
      information the system holds about the present that tells it nothing about the future. The
      authors' conclusion: any system that keeps memory of its environment and operates at maximal
      energetic efficiency has to be predictive.
    what_it_buys: >
      A state-compression objective that is not a heuristic. For any learned representation of market
      state, the quantity to minimize is retained-but-nonpredictive information, and it is measurable
      in the same units as the information retained. It also reframes model complexity: excess
      capacity is not merely wasteful in the statistical sense, it is the exact analogue of a
      thermodynamic inefficiency, with an equality rather than an inequality behind the analogy.
    sources_read:
      - "arXiv 1203.3271 — Still, Sivak, Bell and Crooks, thermodynamics of prediction"
    agent_seed: >
      When building a world model or any compressed market-state representation, instrument
      I[state ; present] and I[state ; future] separately rather than tracking a single loss. Report
      their difference as the primary diagnostic — it is the system's "useless nostalgia" and it has
      a physical interpretation. Design the encoder API so both quantities are estimable at any
      layer, and treat a growing gap during training as the signal to stop adding capacity. This is a
      better stopping rule than validation loss because it says WHY the extra capacity is not paying.

  - finding_id: FIND-PRECISION-COSTS-DISSIPATION
    title: "The precision of any current is bounded by what is dissipated to sustain it"
    status: read
    structure: "The thermodynamic uncertainty relation: a variance-versus-cost inequality for steady-state currents."
    domains: [stochastic_thermodynamics, information_theory, market_microstructure]
    correspondence: >
      For a nonequilibrium steady state, achieving relative uncertainty epsilon in any output current
      requires a cost of at least 2 k_B T / epsilon^2, independent of how long the output takes to
      generate. Precision is not free and its price scales as the inverse square of the tolerance.
    what_it_buys: >
      Paired with the previous finding, it gives two bounds on any predictive machine from the same
      physics: one on what retaining information costs, one on what precision costs. If an analogue
      of the relation holds for order flow — where the measurable dissipation is the time-asymmetry
      of the flow — it would bound the achievable precision of any flow-based signal using only the
      flow, with no strategy fitted. That would be an unusual kind of statement about a market:
      a ceiling derived rather than discovered.
    sources_read:
      - "arXiv 1502.05944 — Barato and Seifert, thermodynamic uncertainty relation"
      - "arXiv 1601.01980 — Flanagan and Lacasa, irreversibility of financial time series"
    open_question: >
      What is the correct market analogue of entropy production, and does any inequality of this shape
      survive the translation? The honest answer today is that nobody has tried.
    agent_seed: >
      Treat this as a research scaffold rather than a formula to apply. Build the measurement side
      first: an irreversibility estimator over flow series with a surrogate null, reported per
      instrument and period. Then, separately, measure the realized precision of flow-based signals in
      the same cells. The interesting artifact is the scatter plot of the two, and whether an envelope
      appears. Do not implement a bound you have not established; implement the two measurements whose
      relationship would reveal one.

  - finding_id: FIND-CRITICAL-SYSTEMS-LOOK-SUBCRITICAL
    title: "A critical system observed through a short window reports as sub-critical, and as trending"
    status: read
    structure: "Estimator bias from a mismatch between kernel support and observation window."
    domains: [point_processes, high_dim_statistics, signal_processing]
    correspondence: >
      Fitting an exponential kernel over thirty-minute windows to data generated by a critical
      power-law kernel returns a branching ratio well below one — and, when the high-frequency cutoff
      of the true kernel shrinks over the years, returns a spuriously RISING branching ratio. The
      published claim that market reflexivity has been increasing reproduces exactly on synthetic
      data generated at constant criticality.
    what_it_buys: >
      A general warning with a specific shape: when a process has mass at long lags and the estimator
      has a short window, the estimator does not merely lose power, it manufactures a trend out of a
      change in some other parameter. The defence is to report the estimate as a function of
      observation scale and to treat a scale-dependent answer as evidence about the kernel rather
      than as a number.
    sources_read:
      - "arXiv 1302.1405 — Hardiman, Bercot and Bouchaud, critical reflexivity"
    agent_seed: >
      Any estimator built over windows should return a scale profile, not a scalar. Make the signature
      estimate(series, scales) -> profile, and let the caller collapse it only if the profile is flat.
      Build the synthetic check into the test suite: generate data at a KNOWN constant parameter with a
      long-memory kernel, run the estimator across scales and across a shrinking cutoff, and assert that
      the reported trend is zero. That test would have caught a published result.

  - finding_id: FIND-ENFORCED-INVARIANTS-BOUND-ARBITRAGE
    title: "Where a protocol enforces an invariant, mispricing cannot live; the tradable surface is the complement"
    status: read
    structure: "Constraint enforcement at the settlement layer versus at the pricing layer."
    domains: [economics_information, defi_mechanics, optimal_transport]
    correspondence: >
      In a conditional-token market, splitting collateral mints a complete set of outcome tokens and
      merging a complete set returns collateral atomically, and negative-risk markets add a conversion
      exchanging one NO token for YES tokens across the other outcomes. Those operations mechanically
      enforce particular logical relations. Other relations — a conjunction priced against its
      Frechet-Hoeffding bounds, for instance — have no corresponding token operation and are enforced
      only by whoever chooses to trade them.
    what_it_buys: >
      The set of relations a system enforces structurally can be enumerated from its mechanism, and
      persistent inconsistency can only exist in the complement. This inverts the usual approach of
      scanning prices for anomalies: derive first where an anomaly is even possible, then look only
      there. It generalizes well beyond prediction markets — any system with atomic invariants has
      this decomposition.
    sources_read:
      - "Polymarket conditional token framework overview, read directly"
      - "arXiv 2208.06046 — Milionis, Moallemi, Roughgarden and Zhang, loss-versus-rebalancing"
    agent_seed: >
      When modelling any venue, write down its enforced invariants as code before writing any pricing
      logic — a function that takes the venue state and returns the constraints that CANNOT be
      violated. Then let the search for opportunities run only over the unconstrained directions.
      Structurally this is the same discipline as writing type invariants before business logic: it
      makes an entire class of impossible states unrepresentable rather than checked for.

  - finding_id: FIND-ADVERSE-SELECTION-RENAMED
    title: "Loss-versus-rebalancing is adverse selection, re-derived by a field that did not know the name"
    status: read
    structure: "The same economic object appearing under different names in disconnected literatures."
    domains: [defi_mechanics, market_microstructure, economics_information]
    correspondence: >
      A liquidity provider's loss relative to a rebalancing strategy is (sigma^2 P^2 / 2) times the
      marginal liquidity of the pool, and provider profit decomposes as rebalancing profits minus that
      loss plus fees. The mechanism the authors describe is a stale quote being picked off when the
      reference price moves — which is the sniping problem of the high-frequency literature and the
      adverse selection of Glosten and Milgrom, expressed through a curve instead of a queue.
    what_it_buys: >
      Two literatures with no shared citations describing one object. Every result about adverse
      selection in a limit order book has a candidate analogue in automated market making, and the
      translation dictionary is short: marginal liquidity plays the role of displayed depth, the
      arbitrageur plays the informed trader, and the fee plays the spread. The translation runs both
      ways, and the AMM side has closed forms the order-book side lacks.
    sources_read:
      - "arXiv 2208.06046 — loss-versus-rebalancing, read directly"
      - "Glosten and Milgrom, held in the corpus"
    agent_seed: >
      Build a shared abstraction for adverse selection that both venue types instantiate: something
      that takes a liquidity supply schedule and a reference price process and returns expected loss to
      informed flow. The AMM case has a closed form and the order-book case does not, which makes the
      AMM the natural test harness for the shared code. Resist writing two separate modules named for
      their venues; the mathematics is one module with two parameterizations.

  - finding_id: FIND-IRREVERSIBILITY-ORTHOGONAL-TO-VOLATILITY
    title: "Time-asymmetry is a genuinely independent axis from volatility"
    status: read
    structure: "An empirical near-independence between two summary statistics of a series."
    domains: [stochastic_thermodynamics, dynamical_systems, high_dim_statistics]
    correspondence: >
      Across thirty-five equities over fourteen years, every series is irreversible to some degree, the
      degree varies substantially across names and fluctuates over time, and the measured irreversibility
      is essentially uncorrelated with volatility — a reported r-squared of about 0.06.
    what_it_buys: >
      An axis that is not a repackaging of volatility. Most market state variables are volatility in
      disguise, which is why so many of them stop working together. A statistic that is empirically
      orthogonal to it is worth having even before anyone shows what it predicts — and its predictive
      value is stated by the authors as an open question rather than a result.
    sources_read:
      - "arXiv 1601.01980 — Flanagan and Lacasa"
      - "arXiv 1809.04377 — Martinez, Herrera-Diestra and Chavez, ordinal-pattern method with surrogates"
    agent_seed: >
      Whenever adding a state variable to any system, test it for orthogonality against volatility
      before testing it for predictive power, and record the correlation permanently next to the
      variable. Build the state-variable registry so each entry carries its correlation with the
      existing set; reject additions that are linear combinations of what is already there. Most
      feature bloat is rediscovering volatility.

  - finding_id: FIND-REPARAMETRIZATION-DISSOLVES-THE-CLOCK
    title: "Path signatures make the choice of clock a non-question"
    status: read
    structure: "Invariance of iterated integrals under reparametrization of the path."
    domains: [rough_paths, signal_processing, market_microstructure]
    correspondence: >
      The signature of a path is unchanged by any reparametrization of time. Two samplings of the same
      underlying path — wall clock, trade clock, volume clock — have identical signatures. The
      antisymmetric part of the second level is the signed area enclosed by a pair of coordinates,
      which measures hysteresis between them with no lag parameter anywhere in it.
    what_it_buys: >
      The clock debate consumes real effort in market feature engineering and the invariance simply
      removes it. The cost is exactly as sharp: signatures cannot see speed, so anything genuinely
      about urgency must add time as an explicit channel. Both the benefit and the cost are theorems
      rather than empirical claims.
    sources_read:
      - "arXiv 1603.03788 — Chevyrev and Kormilitzin, primer on the signature method"
    agent_seed: >
      Implement signature features early in any path-based pipeline, and use the invariance as a TEST:
      compute the signature under two different samplings of the same window and assert equality. That
      assertion catches resampling bugs, alignment bugs and look-ahead leaks in one line, whatever the
      features are eventually used for. Add time as an explicit channel only where urgency is part of
      the question, and make that an explicit, documented choice at the call site.

  - finding_id: FIND-MAXIMAL-INEQUALITY-UNDERWRITES-PEEKING
    title: "One maximal inequality is what makes continuous monitoring safe"
    status: read
    structure: "Ville's inequality for nonnegative supermartingales, and its inversion into confidence sequences."
    domains: [inference_causality, decision_sequential, information_theory]
    correspondence: >
      If M is a test martingale under the null, then P(sup_t M_t >= alpha) <= 1/alpha. Every guarantee
      of anytime-valid inference descends from that single bound: stopping when the wealth process
      first exceeds 1/alpha controls type I error at alpha regardless of the stopping rule, and
      inverting a family of such martingales over a parameter yields a confidence sequence valid at all
      stopping times simultaneously.
    what_it_buys: >
      Peeking becomes safe by construction rather than by correction. The same maximal-inequality
      machinery is what underlies optimal stopping bounds, so sequential testing and optimal exit are
      not merely analogous — they run on the same inequality. A system that monitors a strategy and a
      system that decides when to close a position can share their core.
    sources_read:
      - "arXiv 2210.01948 — Ramdas, Grunwald, Vovk and Shafer, game-theoretic statistics"
    agent_seed: >
      Build monitoring as a wealth process rather than as a rolling statistic with a threshold. The
      interface is: start at one, multiply by a likelihood-ratio-like factor per observation, alarm when
      it crosses 1/alpha. That single abstraction serves strategy decay detection, A/B evaluation and
      anomaly monitoring, and it is correct under arbitrary stopping — which rolling z-scores are not.
      Where a composite null with a nuisance parameter is needed, note that the authors list this as an
      area where the theory is incomplete, so treat any construction there as a research artifact.

  - finding_id: FIND-CATEGORICAL-PRIORITY-IS-A-DIFFERENT-QUEUE
    title: "Discrete batching with categorical priority is not the queueing system the literature models"
    status: read
    structure: "Priority determined by action type before arrival order, inside a discrete batch."
    domains: [queueing_networks, market_microstructure, defi_mechanics]
    correspondence: >
      On an on-chain matching engine, actions within a consensus batch are sorted by category — orders
      not carrying GTC or IOC, then cancels, then orders carrying them — with proposer order breaking
      ties inside each category, at one or two batches per block. Continuous-time order-book models,
      from birth-death queues to heavy-traffic limits, assume genuine arrival-time priority.
    what_it_buys: >
      A concrete instance of a general pattern: when a mechanism batches and then orders by type, the
      resulting system is a different queueing class, and results imported from the continuous case can
      be wrong in direction rather than merely in magnitude. Here, cancels being processed before
      aggressive orders means a resting order has a protection that continuous-time adverse-selection
      calculations do not price.
    sources_read:
      - "Hyperliquid HyperCore order book documentation, read directly"
    agent_seed: >
      Before importing any queueing result, write down the venue's actual ordering rule as an explicit
      comparator function. If that comparator is not "by arrival time", the standard results do not
      apply and the code should say so at the point of use. Build the simulator around the real
      comparator; it costs almost nothing and it makes the difference between the modelled and the
      actual system visible in tests rather than in production.

  - finding_id: FIND-OVERFITTING-HAS-A-CLOSED-FORM
    title: "Backtest optimism is a closed-form function of the aspect ratio and of nothing else"
    status: read
    structure: "Free-probability asymptotics of a quadratic form built from a sample covariance."
    domains: [high_dim_statistics, quant_finance_core, machine_learning_frontier]
    correspondence: >
      Fit a minimum-variance allocation on N assets using T observations, with q = N/T. Bun,
      Bouchaud and Potters derive R_in^2 / (1 - q) = R_true^2 = (1 - q) R_out^2. The risk the fit
      reports understates the risk actually realized by exactly (1 - q)^2. The derivation uses only
      the asymptotic freeness of the sample noise from the population matrix, so the relation holds
      for a COMPLETELY GENERAL population covariance C — nothing about the assets, the market or the
      signal enters it. Bongiorno and Lamrani find the same shape in a different currency: the
      expected information lost by using the sample covariance, E[KL(C||E)], is a closed function of
      q alone and is likewise independent of C.
    what_it_buys: >
      In-sample optimism is usually treated as an unknown to be measured by cross-validation. In
      this regime it is a known number available before any data is seen, fixed by how many
      parameters are fit against how many observations. At q = 1 the arithmetic is brutal and exact:
      in-sample risk is identically zero and out-of-sample risk diverges. A backtest that looks
      flawless at N = T is not evidence of anything; it is the formula being evaluated at its pole.
      It also gives a free specification test — measure in-sample and out-of-sample risk, form their
      ratio, and compare it against (1 - q)^2. A ratio far from the prediction indicts an assumption
      (non-stationarity, a predictor aligned with the principal components, fat tails) rather than
      the strategy.
    sources_read:
      - "arXiv 1610.08104 — Bun, Bouchaud and Potters, cleaning large correlation matrices, sections 7.1.1-7.1.3"
      - "arXiv 2310.01963 — Bongiorno and Lamrani, quantifying the information lost in optimal covariance matrix cleaning, section 3"
    agent_seed: >
      Any harness that fits parameters and reports a performance number should compute q = N/T for
      the fit and report the analytic optimism factor next to the result, unasked. Make it a
      property of the evaluation object rather than a diagnostic someone remembers to run, and make
      the reported number the deflated one with the raw figure available behind it. Then add the
      specification test as a first-class output: the ratio of realized to predicted risk against
      its (1 - q)^2 prediction, with a large deviation raising a flag on the assumptions rather than
      on the strategy. The point is that the correction needs no holdout, no resampling and no extra
      data — it is arithmetic on two integers the harness already knows.

  - finding_id: FIND-SHRINK-PAST-THE-TRUTH
    title: "The best estimator of a covariance is deliberately more conservative than the truth"
    status: read
    structure: "Optimal estimation under partial knowledge of a basis, where uncertainty in the eigenvectors is paid for in the eigenvalues."
    domains: [high_dim_statistics, inference_causality, decision_sequential]
    correspondence: >
      For rotationally invariant estimators, the oracle satisfies Tr(Xi_oracle)^2 <= Tr C^2 <=
      Tr E^2, where C is the population matrix and E the sample one. The middle term is the truth.
      So the optimal cleaned spectrum is narrower not only than the noisy sample spectrum, which is
      unsurprising, but narrower than the population spectrum itself. The reason is structural: an
      RIE keeps the SAMPLE eigenvectors, which are wrong, and the only compensation available is to
      moderate the eigenvalues attached to them. Placing an eigenvalue at its true magnitude on a
      misaligned direction is worse than placing a smaller one there.
    what_it_buys: >
      It separates two objectives that are habitually conflated: recovering the parameters, and
      making good decisions with the parameters. Estimating the population eigenvalues correctly is
      the wrong goal here, and provably so — an estimator that succeeded at it would be beaten by
      one that deliberately undershoots. The general shape is that when a decomposition has a part
      you can estimate well and a part you cannot, the correct response is to bias the part you can
      estimate to absorb the error in the part you cannot, rather than to estimate each part as
      accurately as possible in isolation.
    sources_read:
      - "arXiv 1610.08104 — Bun, Bouchaud and Potters, cleaning large correlation matrices, section 6.3"
    agent_seed: >
      Wherever a system estimates a structure in two pieces — a direction and a magnitude, a
      classification and a confidence, a retrieved document and a relevance weight — do not optimize
      the pieces separately. Ask what the error in the piece you cannot measure implies for the
      piece you can, and shrink the measurable one to absorb it. Build the estimator so the
      shrinkage strength is a function of the estimated error in the OTHER component, and write a
      test asserting the shrunk output is more conservative than the ground truth on synthetic data
      where the truth is known. That test will look wrong to anyone who has not read this; say so in
      the comment.

  - finding_id: FIND-CONVENIENT-LOSS-HIDES-THE-DIVERGENCE
    title: "The tractable loss function is a truncation of the meaningful one, and the truncation is finite exactly where the truth blows up"
    status: read
    structure: "A series expansion in which the conventional objective is the leading term of an information-theoretic objective with a finite radius of convergence."
    domains: [high_dim_statistics, information_theory, machine_learning_frontier]
    correspondence: >
      For the oracle rotationally invariant estimator under an inverse-Wishart population, the
      expected Kullback-Leibler divergence is an alternating series whose leading term is exactly a
      quarter of the expected Frobenius error. Minimizing squared error is therefore minimizing
      information loss to first order. But the series converges only for rq < 4, so there is a
      regime — many features relative to observations — in which the Frobenius error remains finite
      and small while the KL divergence is infinite. The two measures do not merely disagree about
      magnitude there; one of them is reporting a number and the other is reporting that the
      approximation carries no information at all.
    what_it_buys: >
      A concrete instance of a general hazard: the loss function chosen because it is analytically
      tractable agrees with the one you actually care about in the easy regime and diverges from it
      in the hard regime, so the disagreement is invisible in exactly the tests where it would be
      caught. The finite value is the more dangerous output, because a finite number is read as a
      passing grade. This is worth carrying as a template rather than a fact about covariances: ask
      of any convenient objective which meaningful objective it is the leading term of, and where
      that expansion stops converging.
    sources_read:
      - "arXiv 2310.01963 — Bongiorno and Lamrani, quantifying the information lost in optimal covariance matrix cleaning, sections 4-5"
    agent_seed: >
      When a system reports a fit quality, report the regime alongside it, not just the number. Make
      the evaluation compute whether it sits inside the domain where the cheap metric tracks the
      expensive one, and have it refuse — abstain, not warn — outside that domain. Concretely for
      covariance work: compute rq and refuse to report a Frobenius-based quality score once it
      approaches 4. More generally, treat every squared-error objective in the codebase as a
      first-order approximation to something, and make the approximation's validity a checked
      precondition rather than a remark in a docstring.

  - finding_id: FIND-QUOTING-IS-HARDER-THAN-MATCHING
    title: "Quoting a combinatorial market is in a different complexity class from matching one"
    status: read
    structure: "A counting problem hidden inside a pricing rule: the market maker's cost function is a permanent."
    domains: [economics_information, mathematical_foundations, defi_mechanics]
    correspondence: >
      For subset betting over permutations, the LMSR cost function is C(Q) = b log perm(B) with
      B_ij = exp(q_ij / b). Pricing therefore reduces from the permanent of a 0-1 matrix and is
      #P-hard; Boolean betting on disjunctions of two literals is #P-hard by reduction from #2-SAT.
      Meanwhile Chen, Fortnow, Lambert, Pennock and Wortman note that matching divisible subset
      bets — the same bet language, run as an auctioneer with no market maker — is polynomial. The
      automated market maker is not a more convenient implementation of the same mechanism; on the
      same expressive language it is strictly harder, and the hardness sits in the requirement to
      quote a coherent price for every outcome rather than in the bets themselves.
    what_it_buys: >
      It reframes a design choice usually made for liquidity reasons. Polymarket is a central limit
      order book rather than a scoring-rule maker, and this result says the order book can carry
      combinatorial structure that no tractable LMSR could quote. The tractability is bought by
      giving up the guarantee of a price for every proposition — which is exactly the gap that
      logical inconsistency lives in. So the incoherence a CLOB permits is not sloppiness; it is
      the price paid for staying in P, and its size is bounded by how far the matching engine's
      silence can drift before someone trades it away.
    sources_read:
      - "arXiv 0802.1362 — Chen, Fortnow, Lambert, Pennock and Wortman, complexity of combinatorial market makers, sections 4-5"
    agent_seed: >
      Before building any component that maintains a coherent joint distribution over a
      combinatorially large space, ask which counting problem it embeds — the answer is usually a
      permanent or a #SAT count in disguise, and finding it early saves building the exact version
      first. Design the interface so pricing is explicitly approximate with a stated loss bound
      rather than exact-but-slow, and keep an enumerable-space exact path as a test oracle only.
      Where a system consumes prices from a venue, treat the venue's mechanism type as a typed
      property: a scoring-rule maker guarantees coherence and cannot be combinatorial, an order book
      is combinatorial and guarantees nothing, and code that assumes the wrong one will be
      systematically wrong in one direction.

    # This one is the reason to keep a findings file at all: neither literature
    # cites the other in the sources read here, and the bound is the same bound.
  - finding_id: FIND-SUBSIDY-IS-REGRET
    title: "The market maker's worst-case loss and the online learner's regret are one bound"
    status: read
    structure: "Exponential weights, appearing once as a price vector and once as a distribution over experts."
    domains: [economics_information, machine_learning_frontier, information_theory]
    correspondence: >
      LMSR instantaneous prices, p_w(q) proportional to exp(q_w / b), have exactly the form of the
      weights in Littlestone and Warmuth's Weighted Majority. Setting each expert's instantaneous
      loss to l_it = (2 eps - q_it) / (eta b) makes the induced weight sequence the market's price
      sequence, and the standard regret bound eta T + ln(n)/eta then recovers the market maker's
      well-known worst-case subsidy of b ln(n). The liquidity parameter b is the inverse learning
      rate. A trader moving the price is an adversary supplying a loss vector.
    what_it_buys: >
      Two literatures with essentially no shared citations are studying one object, so results
      transfer in both directions. Anything the online-learning community proves about exponential
      weights over structured spaces — permutation learning, tracking a shifting comparator,
      adaptive learning rates — becomes a statement about market-maker pricing, which is how the
      authors get an approximation algorithm for a #P-hard pricing problem with a bounded loss
      guarantee. Read the other way, the market gives an economic reading of the learning rate:
      what a learner pays for adaptivity, a market maker pays as subsidy.
    sources_read:
      - "arXiv 0802.1362 — Chen, Fortnow, Lambert, Pennock and Wortman, complexity of combinatorial market makers, section 6"
    agent_seed: >
      When a system needs to maintain a calibrated distribution that updates in response to
      adversarial evidence, write it once as exponential weights and expose both readings — the
      learning rate and the liquidity parameter are the same number, and having both names available
      makes the tuning argument concrete rather than aesthetic. Practically: reach for the
      online-learning literature whenever a market-maker problem looks intractable, because the
      regret-bounded approximation usually already exists there under a different name, and its loss
      bound translates directly into a subsidy bound. Structure any pricing module so its guarantee
      is stated as a regret, since that is the form in which the proofs are available.

  - finding_id: FIND-BARRIERS-FROM-MARGINALS-ALONE
    title: "Two observed distributions imply hard barriers no consistent model can cross"
    status: read
    structure: "The polar sets of the martingale transport polytope, determined entirely by the convex order of its marginals."
    domains: [mathematical_foundations, economics_information, quant_finance_core]
    correspondence: >
      A martingale can join marginals mu and nu if and only if mu <=_c nu in convex order — the
      distribution may only disperse. Beiglbock, Nutz and Touzi then characterize the polar sets
      completely: a set of trajectories is null under EVERY martingale transport exactly when it
      either crosses a barrier or is negligible for one marginal. Those barriers partition the line
      into irreducible components between which no martingale transport moves any mass, and their
      locations follow from the two marginals with no model, no dynamics and no parameter.
    what_it_buys: >
      Impossibility is usually asserted by a model. Here it is read off two observed distributions.
      Given a marginal now and a marginal later — an option-implied distribution, a prediction
      market's outcome distribution today and at resolution, a state distribution before and after
      an event — the barriers say which joint transitions are excluded under every arbitrage-free
      model at once. That is a null hypothesis with no free parameters, and it is a strong one:
      observing a trajectory across a barrier does not disconfirm one model, it disconfirms the
      martingale property, which usually means the two marginals were not measuring the same thing.
      The same structure explains why convex order is the right compatibility test between any two
      snapshots of a fair-game quantity, prices or not.
    sources_read:
      - "arXiv 1507.00671 — Beiglbock, Nutz and Touzi, complete duality for martingale optimal transport on the line, sections 1.1-1.2 and Theorem 3.2"
    agent_seed: >
      When a system holds two distributions of the same quantity at different times, check convex
      order between them before anything else, and treat a violation as a data-integrity alarm
      rather than a trading signal — it usually means the two snapshots are not the same underlying.
      Then compute the irreducible components and carry them as a partition of the state space that
      downstream models must respect: a transition matrix, a scenario generator or a simulator that
      moves mass across a barrier is wrong by construction and can be rejected in a unit test with
      no reference implementation to compare against. Build this as a validator over distribution
      pairs, because it is one of the very few checks in this area that needs no model to be right.

  - finding_id: FIND-QUASI-SURE-BEATS-POINTWISE
    title: "Robustness against every state costs strictly more than robustness against every model"
    status: read
    structure: "A duality gap that opens under a pointwise constraint and closes under a quasi-sure one."
    domains: [mathematical_foundations, decision_sequential, inference_causality]
    correspondence: >
      The natural dual to martingale optimal transport asks for a static position plus a dynamic
      trade dominating the payoff at EVERY point: phi(x) + psi(y) + h(x)(y - x) >= f(x, y)
      pointwise. Beiglbock, Nutz and Touzi show this formulation both admits a duality gap — with
      compactly supported marginals and a bounded lower semicontinuous reward — and generically
      fails to have an optimizer. Requiring the same inequality to hold only quasi-surely, that is
      almost surely under every martingale transport simultaneously, removes both defects and gives
      duality for arbitrary non-negative Borel rewards with attainment whenever the value is finite.
      The gap is precisely the cost of dominating states that no admissible model reaches.
    what_it_buys: >
      "Worst case" is not one notion but two, and the difference is not a technicality — it is the
      gap between a problem with no solution and a problem with an attained one. Guarding against
      every conceivable state overpays for states the model class already excludes, and the overpay
      can be unbounded. The disciplined version quantifies over models and takes the union of what
      they consider possible. That is the correct shape for any robustness requirement stated over
      a space larger than the reachable one.
    sources_read:
      - "arXiv 1507.00671 — Beiglbock, Nutz and Touzi, complete duality for martingale optimal transport on the line, section 1.2"
    agent_seed: >
      Whenever code enforces a guarantee over a space — an invariant, a safety bound, a worst-case
      cost, a fallback that must never be wrong — ask whether it quantifies over states or over
      models, and prefer models. Implement the check as: enumerate the admissible model class, take
      the union of their supports, and require the property there rather than everywhere the types
      allow. Expect the pointwise version to be both more expensive and, in the cases that matter,
      unsatisfiable. When a robustness constraint turns out to have no feasible solution, this is
      the first thing to suspect: the constraint is probably being asked to hold somewhere nothing
      can reach.

    # The two component identities are each stated in a source read here. The
    # join is not asserted in either, and is why the status is `conjecture`.
  - finding_id: FIND-PRICING-IS-NATURAL-GRADIENT
    title: "Market-maker pricing, exponential weights and natural gradient descent are one algorithm in three coordinate systems"
    status: conjecture
    structure: "A log-partition function, its convex conjugate, and the dual coordinate map between them."
    domains: [economics_information, machine_learning_frontier, information_theory, mathematical_foundations]
    correspondence: >
      Three statements, two of them read and the third a one-line derivative. First: the LMSR cost
      function C(q) = b log sum_omega exp(q_omega / b) is the log-partition function G of a
      categorical exponential family at inverse temperature 1/b, and its instantaneous prices are
      p_omega = dC/dq_omega, which is exactly the mean-parameter map mu = grad G(theta) — so prices
      ARE the dual coordinates of the inventory. Second, read from Chen et al.: those same prices
      are the weights of Weighted Majority, and the market maker's b log(n) subsidy is its regret
      bound. Third, read from Raskutti and Mukherjee: mirror descent under a Bregman divergence B_G
      is natural gradient descent on the dual Riemannian manifold (Phi, grad^2 H) with H the convex
      conjugate of G. Exponential weights is mirror descent with the entropic Bregman divergence.
      Chaining the three, quoting an LMSR is natural gradient descent on the simplex under the
      Fisher metric, with the liquidity parameter b as the inverse learning rate.
    what_it_buys: >
      Two consequences that do not follow from any one of the three readings. Raskutti and Mukherjee
      show mirror descent with log-likelihood loss asymptotically attains the Cramer-Rao bound for
      exponential families; carried across, the market maker's price update is not a plausible
      heuristic with a regret bound bolted on, it is the asymptotically efficient estimator update
      written in mean coordinates. And the computational direction reverses usefully: natural
      gradient is second-order and needs the metric tensor, mirror descent is first-order, so
      anywhere a system wants natural-gradient behaviour it can have it at first-order cost by
      writing the update as a cost-function market instead.
    open_question: >
      Whether Fisher efficiency survives the adversarial setting the market actually faces. The
      efficiency result is asymptotic and assumes data from the family; the regret bound assumes an
      adversary and no distributional assumption at all. They are proved under incompatible
      premises about the same update, and which one describes a real venue with informed traders is
      not something either source addresses.
    sources_read:
      - "arXiv 1310.7780 — Raskutti and Mukherjee, the information geometry of mirror descent, sections 2.1-3.1"
      - "arXiv 0802.1362 — Chen, Fortnow, Lambert, Pennock and Wortman, complexity of combinatorial market makers, section 6"
    agent_seed: >
      Treat "maintain a distribution that updates against evidence" as one component with three
      interfaces, not three components. Write the log-partition function once; derive the prices,
      the weights and the natural-gradient step from it rather than implementing each. The practical
      payoff is that tuning arguments become shared — the liquidity parameter, the learning rate and
      the metric are one number — and so do the guarantees: a regret bound obtained in the learning
      reading is a subsidy bound in the market reading and a convergence rate in the optimization
      reading. When building anything that must be both calibrated and adversarially robust, start
      from the exponential-family form and check which of the two guarantees the deployment actually
      needs, because the efficiency result and the regret result rest on premises that contradict
      each other.

  - finding_id: FIND-REVERSIBILIZATION-IS-A-MEAN
    title: "The two closest reversible chains are the arithmetic and geometric means of a process and its reverse"
    status: read
    structure: "Information projections onto a submanifold that is simultaneously an exponential family and a mixture family."
    domains: [mathematical_foundations, information_theory, signal_processing]
    correspondence: >
      Wolfer and Watanabe show the set of irreducible reversible Markov kernels is both an m-family
      and an e-family — rare enough that they flag it as surprising — and that the projections onto
      it have closed forms. The m-projection is the arithmetic mean P_m = (P + P*)/2 of the kernel
      and its time-reversal; the e-projection is the stochastically rescaled geometric mean,
      proportional to sqrt(P(x,x') P*(x,x')). Each satisfies a Pythagorean identity, in opposite
      argument orders because the divergence is not symmetric, and both projections are equidistant
      from the chain and its reverse. The same manifold is also the smallest exponential family
      containing the symmetric kernels and the smallest mixture family containing the memoryless
      ones — two unrelated generating sets landing on one object.
    what_it_buys: >
      Irreversibility gets a closed form. D(P || P_m) is the divergence from a process to the
      nearest reversible one, with an exact Pythagorean decomposition and no surrogate data,
      no randomization and no p-value machinery — which is what our own `time_irreversibility`
      method needs, since its ordinal-pattern statistic is only interpretable against a simulated
      null. It also settles a question that otherwise looks like taste: there are exactly two
      canonical ways to symmetrize a process, they are the two familiar means, and which one is
      correct is decided by which direction of the divergence the application cares about rather
      than by preference.
    sources_read:
      - "arXiv 2106.05669 — Wolfer and Watanabe, information geometry of reversible Markov chains, section 6 and Theorem 6.1"
    agent_seed: >
      Where a system measures time-asymmetry, estimate a transition kernel and report
      D(P || (P + P*)/2) directly instead of comparing a statistic against shuffled surrogates. It
      is cheaper, deterministic, and decomposes additively, so the contribution of each state pair
      to the total asymmetry falls out of the same computation rather than needing a second pass.
      Keep both projections available and make the choice explicit at the call site: the arithmetic
      mean is right when the reference is the observed process, the geometric mean when the
      reference is the model being tested. Where an existing surrogate-based irreversibility test
      already ships, run both and treat disagreement as informative — the surrogate null and the
      projection are answering slightly different questions and it is worth knowing when they part.
    implemented_as: >
      `reversible_projection` 1.0.0 in scripts/methods.py. Writing it produced a small result the
      source does not state: in edge-measure coordinates D(P || P_m) is exactly the Jensen-Shannon
      divergence between Q and its transpose, since P_m corresponds to the symmetrized edge measure.
      That makes the exact projection and our existing surrogate-calibrated ordinal statistic the
      same divergence applied to different objects. The self-test asserts the identity and the
      Pythagorean decomposition to 1e-12, and a deterministic three-cycle returns exactly ln 2.

  - finding_id: FIND-IRREVERSIBILITY-COSTS-SPECTRAL-STABILITY
    title: "Reversibility is exactly the condition under which eigenvalue estimates are dimension-free"
    status: read
    structure: "A perturbation bound that degrades from dimensionless to exponential in dimension when self-adjointness is lost."
    domains: [mathematical_foundations, high_dim_statistics, dynamical_systems]
    correspondence: >
      A reversible kernel is self-adjoint in the stationary inner product, so its eigenvalues are
      real, the second largest in magnitude controls the mixing time, and eigenvalue perturbation
      obeys Weyl's inequality, whose constant does not involve the dimension. Wolfer and Watanabe
      point out the brittleness on the other side: any deviation from reversibility can send the
      spectrum complex and replaces Weyl with Ostrowski-Elsner, whose bound is possibly exponential
      in the dimension. The property is not a convenience assumption that buys tidier proofs — it is
      the precise boundary between an estimate that is stable in high dimension and one that is not.
    what_it_buys: >
      It connects two things that looked unrelated in this corpus. Time-irreversibility was recorded
      as an interesting state variable because it is empirically orthogonal to volatility; the
      random-matrix reading was about how badly sample eigenvalues mislead in high dimension. This
      says they are the same subject: irreversibility is what makes the eigenvalues hard to estimate.
      So a system that measures asymmetry is also measuring how far it can trust its own spectral
      diagnostics, and the two should be reported together rather than as separate instruments. It
      also gives a reason to project before doing spectral work — the projection is not a
      simplification that loses information, it is what makes the perturbation bound apply.
    sources_read:
      - "arXiv 2106.05669 — Wolfer and Watanabe, information geometry of reversible Markov chains, opening of section 6"
      - "arXiv 1610.08104 — Bun, Bouchaud and Potters, cleaning large correlation matrices, section 6.3"
    agent_seed: >
      Anywhere a system extracts eigenvalues from an estimated operator and acts on them — mixing
      times, spectral clustering, regime counts, principal components of a transition structure —
      first measure how far the operator is from self-adjoint, and gate the confidence attached to
      the spectrum on that distance rather than on sample size alone. Concretely: compute the
      divergence to the reversible projection, and where it is large either project first and say so,
      or widen the uncertainty on every eigenvalue-derived quantity. Treat a complex eigenvalue
      appearing in what should be a stable spectrum as a diagnostic that the reversibility assumption
      has failed, not as a numerical nuisance to take the real part of.

  - finding_id: FIND-STABLE-SORT-LAUNDERS-BIAS
    title: "A corrective re-sort inherits the bias it was meant to remove, through its ties"
    status: read
    structure: "Two-stage ordering where the second stage is stable and its key is degenerate on most inputs."
    domains: [defi_mechanics, queueing_networks, economics_information]
    correspondence: >
      Sui's Mysticeti derives a total order by linearizing the committed sub-DAG, breaking same-round
      ties by validator index — worth about an 89% same-round ordering win to the lower-indexed side
      on a 13-validator network with no attacker running. A gas-price re-sort then runs on top,
      which is the stated reason the arrangement is fair. But that re-sort is stable, and because
      ordinary transactions pay the reference gas price, equal fees are the common case rather than
      an edge case. On every tie the stable sort preserves its input order, so the consensus-stage
      bias passes through the fairness mechanism untouched and costs the beneficiary nothing.
    what_it_buys: >
      A general failure mode, and one that is invisible to the obvious tests. Each stage is correct
      in isolation: the linearization is deterministic as it must be, and the re-sort does exactly
      what a price-priority rule should. The defect is only in the composition, and only on the
      inputs that dominate in practice. Wherever a system corrects an ordering by re-sorting, the
      question is not whether the sort is right but what fraction of comparisons are ties and what
      decides them — and a key that is nearly constant in production makes a corrective sort into
      an identity function that looks like a correction. This is directly the shape of our venue:
      within a category, proposer order breaks ties, so any downstream price-time rule applied to a
      consensus batch inherits proposer order on every equal-priced pair.
    sources_read:
      - "arXiv 2607.13378 — Mirzaei and Amiri, transaction-ordering bias and MEV in Mysticeti, abstract and section 1"
    agent_seed: >
      Any time code re-sorts to impose fairness or priority, measure the tie rate of the sort key on
      real data before trusting it, and treat a high tie rate as the finding rather than as a detail.
      Where ties are common, the tiebreak IS the policy — so make it explicit and, if it should carry
      no information, make it unpredictable per invocation rather than a stable field like an index
      or an identifier. Concretely, prefer a keyed random tiebreak seeded per commit to relying on
      sort stability, and write the test that asserts the output order is uncorrelated with the input
      order among tied elements. A stable sort is the correct default almost everywhere and exactly
      wrong here, which is why this survives review.

  - finding_id: FIND-ADVANTAGE-FROM-ABSTENTION
    title: "In a scheduled system, declining to act can be a stronger move than acting"
    status: read
    structure: "A position determined by relative arrival within a round, where non-participation changes the reference set rather than forfeiting a turn."
    domains: [defi_mechanics, decision_sequential, queueing_networks]
    correspondence: >
      A Mysticeti validator raises its ordering-win rate from roughly 89% to above 94% over
      one-second windows by broadcasting on fewer rounds — speaking only when speaking is worth it.
      The action is legitimate, violates no protocol rule, and is indistinguishable from ordinary
      unavailability, so there is nothing to detect and nothing to penalize. The advantage comes
      from silence changing which competitors are present in the rounds it does join, not from
      anything it does in those rounds.
    what_it_buys: >
      It breaks the assumption that a participant's strategy space is the set of actions. Where
      position depends on the composition of a round rather than on absolute time, the null action
      is a real move, and a model that enumerates only what an agent can do will miss the strongest
      one. It also explains a detection problem that would otherwise look like a data-quality issue:
      strategic silence and downtime produce the same observations, so no monitoring built on
      observed behaviour can separate them, and the separation has to come from what happens in the
      rounds where the participant IS present.
    sources_read:
      - "arXiv 2607.13378 — Mirzaei and Amiri, transaction-ordering bias and MEV in Mysticeti, section 1 summary of section 4.4"
    agent_seed: >
      When modelling an agent in a batched or scheduled venue, put "do nothing this round" in the
      action space as a first-class choice with its own expected value, not as the absence of a
      decision. Build the backtest so abstention is scored — most harnesses silently skip empty
      rounds, which makes the strategy unrepresentable and its advantage unmeasurable. On the
      detection side, do not try to distinguish deliberate silence from unavailability by looking at
      the silence; measure conditional performance in the rounds where the participant did act, since
      a selective participant should show systematically better placement there than a continuous one.

# Patterns worth watching for, recorded so they are noticed when they recur.
recurring_shapes:
  - shape: "A nuisance parameter turns out to select the model class"
    instances: [FIND-EXPONENT-SELECTS-MODEL]
    why_it_matters: "Estimation effort should go to the parameter that decides the family, not to the parameters inside a family chosen by habit."

  - shape: "An estimator whose window is shorter than the process memory manufactures a trend"
    instances: [FIND-CRITICAL-SYSTEMS-LOOK-SUBCRITICAL]
    why_it_matters: "The failure is not loss of power, it is a confident wrong answer that moves in a plausible direction."

  - shape: "The same object under two names in two fields with no shared citations"
    instances: [FIND-ADVERSE-SELECTION-RENAMED, FIND-SUBSIDY-IS-REGRET, FIND-PRICING-IS-NATURAL-GRADIENT]
    why_it_matters: "Each side has results the other lacks, and the translation is usually short once the correspondence is seen."

  - shape: "Tractability bought by giving up a guarantee, with the gap being where the opportunity lives"
    instances: [FIND-QUOTING-IS-HARDER-THAN-MATCHING]
    why_it_matters: "The missing guarantee names the anomaly precisely, so the mechanism tells you what to look for before any data does."

  - shape: "An invariant enforced by the mechanism rather than by the participants"
    instances: [FIND-ENFORCED-INVARIANTS-BOUND-ARBITRAGE, FIND-CATEGORICAL-PRIORITY-IS-A-DIFFERENT-QUEUE, FIND-BARRIERS-FROM-MARGINALS-ALONE]

  - shape: "Each stage correct, the composition wrong, and only on the common input"
    instances: [FIND-STABLE-SORT-LAUNDERS-BIAS]
    why_it_matters: "Unit tests on either stage pass; the defect needs the tie rate on production data to become visible at all."

  - shape: "The null action is a move, and the model does not have a slot for it"
    instances: [FIND-ADVANTAGE-FROM-ABSTENTION]
    why_it_matters: "A strategy space built from available actions omits abstention, so the best strategy can be one the model cannot express."
    why_it_matters: "Enforced invariants bound where anything interesting can happen, and they are enumerable from the mechanism in advance."

  - shape: "A penalty fixed by the geometry of the estimation rather than by its content"
    instances: [FIND-OVERFITTING-HAS-A-CLOSED-FORM]
    why_it_matters: "When the cost depends only on how many parameters meet how much data, it is knowable before the data is seen and needs no holdout to correct."

  - shape: "Estimating each component as well as possible is not the optimum"
    instances: [FIND-SHRINK-PAST-THE-TRUTH]
    why_it_matters: "Error in a component you cannot measure has to be absorbed somewhere; the component you can measure is the only place available."

  - shape: "The tractable objective agrees with the real one only in the easy regime"
    instances: [FIND-CONVENIENT-LOSS-HIDES-THE-DIVERGENCE]
    why_it_matters: "The disagreement is absent from the tests that would catch it, and the surviving number reads as a pass."

  - shape: "Quantifying over states where quantifying over models was meant"
    instances: [FIND-QUASI-SURE-BEATS-POINTWISE]
    why_it_matters: "The stronger-looking requirement is not conservative, it is a different and often infeasible problem."

  - shape: "A quantity that is empirically orthogonal to volatility"
    instances: [FIND-IRREVERSIBILITY-ORTHOGONAL-TO-VOLATILITY, FIND-IRREVERSIBILITY-COSTS-SPECTRAL-STABILITY]
    why_it_matters: "Most proposed state variables are volatility wearing a hat; the rare orthogonal one is worth keeping even before it predicts anything."

  - shape: "Two unrelated generating sets converging on the same object"
    instances: [FIND-REVERSIBILIZATION-IS-A-MEAN]
    why_it_matters: "A structure reachable from two directions is usually more canonical than either derivation suggests, and inherits results from both."

  - shape: "One inequality underwriting several apparently separate capabilities"
    instances: [FIND-MAXIMAL-INEQUALITY-UNDERWRITES-PEEKING, FIND-DISSIPATION-IS-NONPREDICTIVE-MEMORY, FIND-PRECISION-COSTS-DISSIPATION]
    why_it_matters: "Shared foundations mean shared code and shared failure modes; finding them collapses apparent complexity."
