checkpoint_interval: 10

workers:
  pools:
    # Scoring a policy is a sub-second deterministic evaluation, so this lab can
    # actually run unattended, unlike the corpus lab where a human does the work.
    - resource_class: "cpu"
      slots: 3
      lease_timeout_seconds: 900
      heartbeat_timeout_seconds: 300

selection:
  crossover_probability: 0.25
  max_concurrent_per_lineage: 3
  elite_archive:
    global_top_k: 8
    family_top_k: 2
  pareto_mode: "read_only"

funding:
  dispatch_cost: 1
  promote_credit: 3
  stable_credit: 1
  novelty_credit: 1
  prediction_credit: 3

plateau:
  window: 4
  min_delta: 0.005
